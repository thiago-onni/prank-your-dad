quarkus.application.name=sus-nexus-fhir-gateway
quarkus.http.port=8081

# ---------------------------------------------------------------------------
# Banco de dados: Flyway migra como administrador; a aplicação usa papel restrito (RLS)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${FHIR_DB_URL:jdbc:postgresql://localhost:5432/sus_nexus_fhir}
quarkus.datasource.username=${FHIR_DB_APP_USER:sus_nexus_fhir_app}
quarkus.datasource.password=${FHIR_DB_APP_PASSWORD:sus_nexus_fhir_app}
quarkus.datasource.jdbc.max-size=16

quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=fhir
quarkus.flyway.default-schema=fhir
quarkus.flyway.username=${FHIR_DB_ADMIN_USER:postgres}
quarkus.flyway.password=${FHIR_DB_ADMIN_PASSWORD:postgres}

# ---------------------------------------------------------------------------
# Segurança
# ---------------------------------------------------------------------------
quarkus.oidc.auth-server-url=${OIDC_URL:http://localhost:8180/realms/sus-nexus}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:fhir-gateway}
quarkus.oidc.application-type=service
quarkus.http.auth.proactive=false

# oidc | test-headers (identidade fake via X-Test-User / X-Test-Scopes / X-Tenant-Id)
sus.fhir.security.mode=oidc
sus.fhir.security.tenant-claim=municipality_id
sus.fhir.security.scope-claim=scope

# Chave HMAC do cursor de paginação (trocar em produção via segredo)
sus.fhir.search.cursor-secret=${FHIR_CURSOR_SECRET:change-me-dev-cursor-secret}
sus.fhir.search.default-count=20
sus.fhir.search.max-count=200

# ---------------------------------------------------------------------------
# Validação (ADR-003): official = InstanceValidator HL7 com definições base 4.0.1 do classpath;
#                      structural = parser estrito + cardinalidade dos modelos + FHIRPath (sem StructureDefinitions)
# ---------------------------------------------------------------------------
sus.fhir.validation.mode=official
# Pacotes de IG (NPM .tgz) adicionais a carregar do classpath (ver src/main/resources/fhir/profiles/README.md)
sus.fhir.validation.ig-packages=

# ---------------------------------------------------------------------------
# Perfis BR (canônicos parametrizáveis; ver README)
# ---------------------------------------------------------------------------
sus.fhir.profiles.base-url=https://br-core.saude.gov.br/fhir/StructureDefinition
sus.fhir.profiles.patient=${sus.fhir.profiles.base-url}/BRCorePatient
sus.fhir.profiles.organization=${sus.fhir.profiles.base-url}/BRCoreOrganization
sus.fhir.profiles.location=${sus.fhir.profiles.base-url}/BRCoreLocation
sus.fhir.profiles.practitioner=${sus.fhir.profiles.base-url}/BRCorePractitioner
sus.fhir.profiles.practitioner-role=${sus.fhir.profiles.base-url}/BRCorePractitionerRole
# FHIR-2: br-core quando existir (Encounter, Condition); perfis municipais para os demais
sus.fhir.profiles.encounter=${sus.fhir.profiles.base-url}/BRCoreEncounter
sus.fhir.profiles.condition=${sus.fhir.profiles.base-url}/BRCoreCondition
sus.fhir.profiles.municipal-base-url=http://sus-nexus.gov.br/fhir/StructureDefinition
sus.fhir.profiles.appointment=${sus.fhir.profiles.municipal-base-url}/SUSNexusAppointment
sus.fhir.profiles.service-request=${sus.fhir.profiles.municipal-base-url}/SUSNexusServiceRequest
sus.fhir.profiles.task=${sus.fhir.profiles.municipal-base-url}/SUSNexusTask
sus.fhir.profiles.care-plan=${sus.fhir.profiles.municipal-base-url}/SUSNexusCarePlan
# FHIR-3: resultados de exame, laudos e documentos (perfis municipais)
sus.fhir.profiles.observation=${sus.fhir.profiles.municipal-base-url}/SUSNexusObservation
sus.fhir.profiles.diagnostic-report=${sus.fhir.profiles.municipal-base-url}/SUSNexusDiagnosticReport
sus.fhir.profiles.document-reference=${sus.fhir.profiles.municipal-base-url}/SUSNexusDocumentReference
# Se true, meta.profile é obrigatório para recursos com perfil configurado
sus.fhir.profiles.require-profile=true

sus.fhir.base-url=${FHIR_BASE_URL:http://localhost:8081/fhir/r4}

# ---------------------------------------------------------------------------
# Terminologia dos mapeadores (FHIR-2)
# ---------------------------------------------------------------------------
sus.fhir.terminology.sigtap-system=${SIGTAP_SYSTEM:http://www.saude.gov.br/fhir/r4/CodeSystem/BRTabelaSUS}
sus.fhir.terminology.loinc-system=http://loinc.org
sus.fhir.terminology.local-system=http://sus-nexus.gov.br/fhir/CodeSystem/local-procedure
sus.fhir.terminology.ucum-system=http://unitsofmeasure.org

# ---------------------------------------------------------------------------
# FHIR-3: Binary no object storage (file em dev/test; s3 em produção) e limites de $everything
# ---------------------------------------------------------------------------
sus.fhir.binary.storage=${FHIR_BINARY_STORAGE:file}
sus.fhir.binary.file-dir=${FHIR_BINARY_DIR:target/fhir-binary}
sus.fhir.binary.max-bytes=${FHIR_BINARY_MAX_BYTES:20971520}
sus.fhir.binary.s3.bucket=${FHIR_BINARY_S3_BUCKET:sus-nexus-fhir-binary}
sus.fhir.binary.s3.region=${FHIR_BINARY_S3_REGION:sa-east-1}
sus.fhir.binary.s3.endpoint=${FHIR_BINARY_S3_ENDPOINT:}
sus.fhir.binary.s3.path-style=${FHIR_BINARY_S3_PATH_STYLE:true}
sus.fhir.binary.s3.access-key=${FHIR_BINARY_S3_ACCESS_KEY:}
sus.fhir.binary.s3.secret-key=${FHIR_BINARY_S3_SECRET_KEY:}
sus.fhir.everything.default-count=50
sus.fhir.everything.max-count=200
sus.fhir.everything.max-pages=${FHIR_EVERYTHING_MAX_PAGES:100}

# ---------------------------------------------------------------------------
# Projeção por Kafka (FHIR-2): consumidor busca o canônico completo no core via REST
# ---------------------------------------------------------------------------
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.schedule-appointment.connector=smallrye-kafka
mp.messaging.incoming.schedule-appointment.topic=sus.schedule.appointment.v1
mp.messaging.incoming.task.connector=smallrye-kafka
mp.messaging.incoming.task.topic=sus.task.v1
mp.messaging.incoming.regulation-request.connector=smallrye-kafka
mp.messaging.incoming.regulation-request.topic=sus.regulation.request.v1
mp.messaging.incoming.regulation-status.connector=smallrye-kafka
mp.messaging.incoming.regulation-status.topic=sus.regulation.status.v1
mp.messaging.incoming.exam-order.connector=smallrye-kafka
mp.messaging.incoming.exam-order.topic=sus.exam.order.v1
mp.messaging.incoming.aps-encounter.connector=smallrye-kafka
mp.messaging.incoming.aps-encounter.topic=sus.aps.encounter.v1
# FHIR-3
mp.messaging.incoming.exam-result.connector=smallrye-kafka
mp.messaging.incoming.exam-result.topic=sus.exam.result.v1
mp.messaging.incoming.hospital-adt.connector=smallrye-kafka
mp.messaging.incoming.hospital-adt.topic=sus.hospital.adt.v1
mp.messaging.incoming.hospital-discharge.connector=smallrye-kafka
mp.messaging.incoming.hospital-discharge.topic=sus.hospital.discharge.v1
mp.messaging.incoming.careplan.connector=smallrye-kafka
mp.messaging.incoming.careplan.topic=sus.careplan.v1
mp.messaging.incoming.caregap.connector=smallrye-kafka
mp.messaging.incoming.caregap.topic=sus.caregap.v1
mp.messaging.connector.smallrye-kafka.group.id=${FHIR_PROJECTION_GROUP:fhir-gateway-projection}
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.failure-strategy=${FHIR_PROJECTION_FAILURE_STRATEGY:fail}

# Core municipal (REST client + client-credentials)
quarkus.rest-client.core-municipal.url=${CORE_URL:http://localhost:8080}
quarkus.rest-client.core-municipal.scope=jakarta.inject.Singleton
quarkus.rest-client.core-auth.url=${CORE_TOKEN_URL:http://localhost:8180/realms/sus-nexus/protocol/openid-connect}
quarkus.rest-client.core-auth.scope=jakarta.inject.Singleton
sus.fhir.core.token-url=${CORE_TOKEN_URL:}
sus.fhir.core.client-id=${CORE_CLIENT_ID:fhir-gateway}
sus.fhir.core.client-secret=${CORE_CLIENT_SECRET:}

# ---------------------------------------------------------------------------
# Logs JSON sem PII
# ---------------------------------------------------------------------------
quarkus.log.level=INFO
quarkus.log.category."org.hl7.fhir".level=WARN
quarkus.log.category."ca.uhn".level=WARN

# ---------------------------------------------------------------------------
# Perfis dev/test: sem OIDC, identidade via headers, banco local
# ---------------------------------------------------------------------------
%dev.quarkus.oidc.enabled=false
%dev.sus.fhir.security.mode=test-headers
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sus_nexus_fhir
%dev.quarkus.flyway.clean-at-start=false

%test.quarkus.oidc.enabled=false
%test.sus.fhir.security.mode=test-headers
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sus_nexus_fhir_test
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.sus.fhir.base-url=http://localhost:8081/fhir/r4
%test.quarkus.http.test-port=0
%test.quarkus.log.level=WARN
# Kafka em memória nos testes; o core é simulado por WireMock (CoreWireMockResource)
%test.mp.messaging.incoming.schedule-appointment.connector=smallrye-in-memory
%test.mp.messaging.incoming.task.connector=smallrye-in-memory
%test.mp.messaging.incoming.regulation-request.connector=smallrye-in-memory
%test.mp.messaging.incoming.regulation-status.connector=smallrye-in-memory
%test.mp.messaging.incoming.exam-order.connector=smallrye-in-memory
%test.mp.messaging.incoming.aps-encounter.connector=smallrye-in-memory
%test.mp.messaging.incoming.exam-result.connector=smallrye-in-memory
%test.mp.messaging.incoming.hospital-adt.connector=smallrye-in-memory
%test.mp.messaging.incoming.hospital-discharge.connector=smallrye-in-memory
%test.mp.messaging.incoming.careplan.connector=smallrye-in-memory
%test.mp.messaging.incoming.caregap.connector=smallrye-in-memory
%test.sus.fhir.binary.storage=file
%test.sus.fhir.binary.file-dir=target/fhir-binary-test
%test.sus.fhir.everything.max-pages=3
%test.sus.fhir.core.client-secret=test-secret
