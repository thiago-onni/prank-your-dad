# =====================================================================
# SUS Nexus — core-municipal
# Perfis: %dev (local, sem Keycloak), %test (CI local, sem Docker), %prod
# =====================================================================
quarkus.application.name=core-municipal
quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.devservices.enabled=false

# --- Jackson / API ---
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null
quarkus.jackson.fail-on-unknown-properties=false

# --- Datasource (a aplicação usa um papel SEM bypass de RLS) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SUS_DB_APP_USER:sus_nexus_app}
quarkus.datasource.password=${SUS_DB_APP_PASSWORD:sus_nexus_app}
quarkus.datasource.jdbc.url=${SUS_DB_URL:jdbc:postgresql://localhost:5432/sus_nexus}
quarkus.datasource.jdbc.max-size=16

# --- Flyway (roda com usuário administrador; cria o papel da aplicação) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.username=${SUS_DB_ADMIN_USER:postgres}
quarkus.flyway.password=${SUS_DB_ADMIN_PASSWORD:postgres}
quarkus.flyway.schemas=platform,audit,reference,terminology,identity,integration,scheduling,tasks,journey,regulation,exams
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.locations=db/migration

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
# Colunas jsonb (Map/List) usam o Jackson padrão do Hibernate, não o ObjectMapper da API (snake_case)
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Segurança ---
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sus-nexus}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:core-municipal}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:changeme}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.http.auth.proactive=true
# Autenticação por cabeçalho (X-Test-User / X-Test-Roles): somente dev/test
sus.security.header-auth.enabled=false
# Tenant via cabeçalho X-Tenant-Id (em prod vem apenas do claim municipality_id)
sus.tenant.header-enabled=false

# --- SUS Nexus — identidade ---
# Chave-mestra HMAC (hex ou base64); por tenant deriva-se HMAC(master, tenant_id)
sus.identity.hmac-key=${SUS_IDENTITY_HMAC_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
# Chave AES-256 (base64, 32 bytes) para value_enc de identificadores de alto risco
sus.identity.enc-key=${SUS_IDENTITY_ENC_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}

# --- SUS Nexus — MPI (Fellegi-Sunter) ---
sus.mpi.rule-version=mpi-rules-1.0
sus.mpi.threshold.high=22.0
sus.mpi.threshold.low=12.0
sus.mpi.jaro-winkler.agree=0.92
sus.mpi.jaro-winkler.partial=0.85
sus.mpi.blocking.limit=50
sus.mpi.blocking.min-similarity=0.4
sus.mpi.weights.name.m=0.95
sus.mpi.weights.name.u=0.001
sus.mpi.weights.mother-name.m=0.90
sus.mpi.weights.mother-name.u=0.001
sus.mpi.weights.birthdate.m=0.98
sus.mpi.weights.birthdate.u=0.0001
sus.mpi.weights.sex.m=0.99
sus.mpi.weights.sex.u=0.5
sus.mpi.weights.phone.m=0.70
sus.mpi.weights.phone.u=0.001

# --- SUS Nexus — autorização (rbac = política local por papéis; opa = OPA via HTTP, fail-closed) ---
sus.authz.mode=rbac
sus.authz.opa-url=${OPA_URL:http://localhost:8181}
sus.authz.opa-timeout=PT2S

# --- SUS Nexus — idempotência de API (Idempotency-Key) ---
sus.idempotency.ttl=PT72H
sus.idempotency.purge-every=1h

# --- SUS Nexus — agenda ---
sus.scheduling.duplicate-window-hours=72

# --- SUS Nexus — regulação (REG-005/010) ---
# tipos de pedido em que attached_documents_count=0 gera pendência missing_document
sus.regulation.documents-required-kinds=procedure,surgery,admission

# --- SUS Nexus — exames (EXA-004/005/006/009) ---
sus.exams.not-scheduled-days=15
sus.exams.result-pending-days=7
sus.exams.followup-days=10
# referência segura ao laudo: URL assinada (HMAC-SHA256) de curta duração
sus.exams.document-base-url=${SUS_EXAM_DOCUMENT_BASE_URL:http://localhost:9000/exam-documents}
sus.exams.document-signing-key=${SUS_EXAM_DOCUMENT_SIGNING_KEY:change-me-exam-document-key}
sus.exams.document-link-ttl=PT5M

# --- SUS Nexus — Temporal (conexão real só com enabled=true) ---
sus.temporal.enabled=false
sus.temporal.target=${TEMPORAL_TARGET:localhost:7233}
sus.temporal.namespace=${TEMPORAL_NAMESPACE:default}
sus.temporal.task-queue=tasks

# --- SUS Nexus — outbox relay de desenvolvimento (produção: Debezium Outbox Event Router) ---
sus.outbox.relay.enabled=false
sus.outbox.relay.every=5s
sus.outbox.relay.batch-size=100

# --- Kafka (SmallRye Reactive Messaging) ---
# Canais ← tópicos (contracts/events/topics.yaml). Valores em String (envelope JSON).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.connector.smallrye-kafka.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.failure-strategy=dead-letter-queue
mp.messaging.connector.smallrye-kafka.dead-letter-queue.topic=sus.dlq.v1

# ingestão (conectores → core)
mp.messaging.incoming.ingest-pec-in.connector=smallrye-kafka
mp.messaging.incoming.ingest-pec-in.topic=sus.ingest.pec.v1
mp.messaging.incoming.ingest-pec-in.group.id=core-ingest-pec
mp.messaging.incoming.ingest-agenda-in.connector=smallrye-kafka
mp.messaging.incoming.ingest-agenda-in.topic=sus.ingest.agenda.v1
mp.messaging.incoming.ingest-agenda-in.group.id=core-ingest-agenda
mp.messaging.incoming.ingest-regulation-in.connector=smallrye-kafka
mp.messaging.incoming.ingest-regulation-in.topic=sus.ingest.regulation.v1
mp.messaging.incoming.ingest-regulation-in.group.id=core-ingest-regulation
mp.messaging.incoming.ingest-exam-in.connector=smallrye-kafka
mp.messaging.incoming.ingest-exam-in.topic=sus.ingest.exam.v1
mp.messaging.incoming.ingest-exam-in.group.id=core-ingest-exam
# operação
mp.messaging.incoming.integration-status-in.connector=smallrye-kafka
mp.messaging.incoming.integration-status-in.topic=sus.integration.status.v1
mp.messaging.incoming.integration-status-in.group.id=core-integration-status
# tasks (workflows e revisão do MPI)
mp.messaging.incoming.tasks-merge-in.connector=smallrye-kafka
mp.messaging.incoming.tasks-merge-in.topic=sus.identity.merge.v1
mp.messaging.incoming.tasks-merge-in.group.id=core-tasks-merge
mp.messaging.incoming.tasks-task-in.connector=smallrye-kafka
mp.messaging.incoming.tasks-task-in.topic=sus.task.v1
mp.messaging.incoming.tasks-task-in.group.id=core-tasks-sla
# regulation (RegulationSlaWorkflow)
mp.messaging.incoming.regulation-request-in.connector=smallrye-kafka
mp.messaging.incoming.regulation-request-in.topic=sus.regulation.request.v1
mp.messaging.incoming.regulation-request-in.group.id=core-regulation-sla
mp.messaging.incoming.regulation-status-in.connector=smallrye-kafka
mp.messaging.incoming.regulation-status-in.topic=sus.regulation.status.v1
mp.messaging.incoming.regulation-status-in.group.id=core-regulation-sla
# exams (ExamFollowUpWorkflow)
mp.messaging.incoming.exams-order-in.connector=smallrye-kafka
mp.messaging.incoming.exams-order-in.topic=sus.exam.order.v1
mp.messaging.incoming.exams-order-in.group.id=core-exams-followup
mp.messaging.incoming.exams-result-in.connector=smallrye-kafka
mp.messaging.incoming.exams-result-in.topic=sus.exam.result.v1
mp.messaging.incoming.exams-result-in.group.id=core-exams-followup
mp.messaging.incoming.exams-task-in.connector=smallrye-kafka
mp.messaging.incoming.exams-task-in.topic=sus.task.v1
mp.messaging.incoming.exams-task-in.group.id=core-exams-followup
mp.messaging.incoming.exams-appointment-in.connector=smallrye-kafka
mp.messaging.incoming.exams-appointment-in.topic=sus.schedule.appointment.v1
mp.messaging.incoming.exams-appointment-in.group.id=core-exams-followup
# journey (projeções da timeline)
mp.messaging.incoming.journey-identity-in.connector=smallrye-kafka
mp.messaging.incoming.journey-identity-in.topic=sus.identity.citizen.v1
mp.messaging.incoming.journey-identity-in.group.id=core-journey
mp.messaging.incoming.journey-merge-in.connector=smallrye-kafka
mp.messaging.incoming.journey-merge-in.topic=sus.identity.merge.v1
mp.messaging.incoming.journey-merge-in.group.id=core-journey
mp.messaging.incoming.journey-appointment-in.connector=smallrye-kafka
mp.messaging.incoming.journey-appointment-in.topic=sus.schedule.appointment.v1
mp.messaging.incoming.journey-appointment-in.group.id=core-journey
mp.messaging.incoming.journey-task-in.connector=smallrye-kafka
mp.messaging.incoming.journey-task-in.topic=sus.task.v1
mp.messaging.incoming.journey-task-in.group.id=core-journey
mp.messaging.incoming.journey-regulation-request-in.connector=smallrye-kafka
mp.messaging.incoming.journey-regulation-request-in.topic=sus.regulation.request.v1
mp.messaging.incoming.journey-regulation-request-in.group.id=core-journey
mp.messaging.incoming.journey-regulation-status-in.connector=smallrye-kafka
mp.messaging.incoming.journey-regulation-status-in.topic=sus.regulation.status.v1
mp.messaging.incoming.journey-regulation-status-in.group.id=core-journey
mp.messaging.incoming.journey-exam-order-in.connector=smallrye-kafka
mp.messaging.incoming.journey-exam-order-in.topic=sus.exam.order.v1
mp.messaging.incoming.journey-exam-order-in.group.id=core-journey
mp.messaging.incoming.journey-exam-result-in.connector=smallrye-kafka
mp.messaging.incoming.journey-exam-result-in.topic=sus.exam.result.v1
mp.messaging.incoming.journey-exam-result-in.group.id=core-journey
# saída (somente OutboxRelay de desenvolvimento; em produção o Debezium publica)
mp.messaging.outgoing.citizen-out.connector=smallrye-kafka
mp.messaging.outgoing.citizen-out.topic=sus.identity.citizen.v1
mp.messaging.outgoing.merge-out.connector=smallrye-kafka
mp.messaging.outgoing.merge-out.topic=sus.identity.merge.v1
mp.messaging.outgoing.appointment-out.connector=smallrye-kafka
mp.messaging.outgoing.appointment-out.topic=sus.schedule.appointment.v1
mp.messaging.outgoing.task-out.connector=smallrye-kafka
mp.messaging.outgoing.task-out.topic=sus.task.v1
mp.messaging.outgoing.integration-command-out.connector=smallrye-kafka
mp.messaging.outgoing.integration-command-out.topic=sus.integration.command.v1
mp.messaging.outgoing.regulation-request-out.connector=smallrye-kafka
mp.messaging.outgoing.regulation-request-out.topic=sus.regulation.request.v1
mp.messaging.outgoing.regulation-status-out.connector=smallrye-kafka
mp.messaging.outgoing.regulation-status-out.topic=sus.regulation.status.v1
mp.messaging.outgoing.exam-order-out.connector=smallrye-kafka
mp.messaging.outgoing.exam-order-out.topic=sus.exam.order.v1
mp.messaging.outgoing.exam-result-out.connector=smallrye-kafka
mp.messaging.outgoing.exam-result-out.topic=sus.exam.result.v1

# --- Observabilidade ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.sdk.disabled=false
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.smallrye-health.root-path=/q/health

# --- Logs (JSON sem PII em prod; filtro de mascaramento sempre ativo) ---
quarkus.log.console.json.enabled=false
quarkus.log.console.filter=pii-mask
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) corr=%X{correlation_id} tenant=%X{tenant_id} %s%e%n
quarkus.log.category."br.gov.sus.nexus".level=INFO

# ---------------------------------------------------------------------
# %prod
# ---------------------------------------------------------------------
%prod.quarkus.log.console.json.enabled=true
%prod.quarkus.oidc.enabled=true

# ---------------------------------------------------------------------
# %dev
# ---------------------------------------------------------------------
%dev.quarkus.oidc.enabled=false
%dev.quarkus.otel.sdk.disabled=true
%dev.sus.security.header-auth.enabled=true
%dev.sus.tenant.header-enabled=true
%dev.quarkus.hibernate-orm.log.sql=false
# dev local sem Debezium: relay do outbox para o Kafka local
%dev.sus.outbox.relay.enabled=true

# ---------------------------------------------------------------------
# %test — PostgreSQL local, sem Docker
# ---------------------------------------------------------------------
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/sus_nexus_test
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.flyway.clean-disabled=false
%test.quarkus.oidc.enabled=false
%test.quarkus.otel.sdk.disabled=true
%test.sus.security.header-auth.enabled=true
%test.sus.tenant.header-enabled=true
%test.quarkus.log.level=INFO
%test.quarkus.log.category."br.gov.sus.nexus".level=DEBUG
%test.sus.idempotency.purge-every=off
%test.sus.outbox.relay.every=off
# Kafka substituído pelo conector in-memory (sem broker)
%test.mp.messaging.incoming.ingest-pec-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.ingest-agenda-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.integration-status-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.tasks-merge-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.tasks-task-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.journey-identity-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.journey-merge-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.journey-appointment-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.journey-task-in.connector=smallrye-in-memory
%test.mp.messaging.outgoing.citizen-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.merge-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.appointment-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.task-out.connector=smallrye-in-memory
%test.mp.messaging.outgoing.integration-command-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.ingest-regulation-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.ingest-exam-in.connector=smallrye-in-memory
%test.mp.messaging.incoming.regulation-request-in.connector=smallrye-in-memory
