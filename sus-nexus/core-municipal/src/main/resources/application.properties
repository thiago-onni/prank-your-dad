# =====================================================================
# SUS Nexus — core-municipal
# Perfis: %dev (local, sem Keycloak), %test (CI local, sem Docker), %prod
# =====================================================================
quarkus.application.name=core-municipal
quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.devservices.enabled=false

# --- Jackson / API ---
quarkus.jackson.property-naming-strategy=SNAKE_CASE
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.serialization-inclusion=non_null
quarkus.jackson.fail-on-unknown-properties=false

# --- Datasource (a aplicação usa um papel SEM bypass de RLS) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${SUS_DB_APP_USER:sus_nexus_app}
quarkus.datasource.password=${SUS_DB_APP_PASSWORD:sus_nexus_app}
quarkus.datasource.jdbc.url=${SUS_DB_URL:jdbc:postgresql://localhost:5432/sus_nexus}
quarkus.datasource.jdbc.max-size=16

# --- Flyway (roda com usuário administrador; cria o papel da aplicação) ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.username=${SUS_DB_ADMIN_USER:postgres}
quarkus.flyway.password=${SUS_DB_ADMIN_PASSWORD:postgres}
quarkus.flyway.schemas=platform,audit,reference,terminology,identity,integration,scheduling,tasks,journey,regulation,exams,hospital,careplan,consent,production
quarkus.flyway.baseline-on-migrate=false
quarkus.flyway.locations=db/migration

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
# Colunas jsonb (Map/List) usam o Jackson padrão do Hibernate, não o ObjectMapper da API (snake_case)
quarkus.hibernate-orm.mapping.format.global=ignore

# --- Segurança ---
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:sus-nexus}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:core-municipal}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:changeme}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.http.auth.proactive=true
# Autenticação por cabeçalho (X-Test-User / X-Test-Roles): somente dev/test
sus.security.header-auth.enabled=false
# Tenant via cabeçalho X-Tenant-Id (em prod vem apenas do claim municipality_id)
sus.tenant.header-enabled=false

# --- SUS Nexus — identidade ---
# Chave-mestra HMAC (hex ou base64); por tenant deriva-se HMAC(master, tenant_id)
sus.identity.hmac-key=${SUS_IDENTITY_HMAC_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
# Chave AES-256 (base64, 32 bytes) para value_enc de identificadores de alto risco
sus.identity.enc-key=${SUS_IDENTITY_ENC_KEY:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}

# --- SUS Nexus — MPI (Fellegi-Sunter) ---
sus.mpi.rule-version=mpi-rules-1.0
sus.mpi.threshold.high=22.0
sus.mpi.threshold.low=12.0
sus.mpi.jaro-winkler.agree=0.92
sus.mpi.jaro-winkler.partial=0.85
sus.mpi.blocking.limit=50
sus.mpi.blocking.min-similarity=0.4
sus.mpi.weights.name.m=0.95
sus.mpi.weights.name.u=0.001
sus.mpi.weights.mother-name.m=0.90
sus.mpi.weights.mother-name.u=0.001
sus.mpi.weights.birthdate.m=0.98
sus.mpi.weights.birthdate.u=0.0001
sus.mpi.weights.sex.m=0.99
sus.mpi.weights.sex.u=0.5
sus.mpi.weights.phone.m=0.70
sus.mpi.weights.phone.u=0.001

# --- SUS Nexus — autorização (rbac = política local por papéis; opa = OPA via HTTP, fail-closed) ---
sus.authz.mode=rbac
sus.authz.opa-url=${OPA_URL:http://localhost:8181}
sus.authz.opa-timeout=PT2S

# --- SUS Nexus — idempotência de API (Idempotency-Key) ---
sus.idempotency.ttl=PT72H
sus.idempotency.purge-every=1h

# --- SUS Nexus — agenda ---
sus.scheduling.duplicate-window-hours=72

# --- SUS Nexus — regulação (REG-005/010) ---
# tipos de pedido em que attached_documents_count=0 gera pendência missing_document
sus.regulation.documents-required-kinds=procedure,surgery,admission

# --- SUS Nexus — exames (EXA-004/005/006/009) ---
sus.exams.not-scheduled-days=15
sus.exams.result-pending-days=7
sus.exams.followup-days=10
# referência segura ao laudo: URL assinada (HMAC-SHA256) de curta duração
sus.exams.document-base-url=${SUS_EXAM_DOCUMENT_BASE_URL:http://localhost:9000/exam-documents}
sus.exams.document-signing-key=${SUS_EXAM_DOCUMENT_SIGNING_KEY:change-me-exam-document-key}
sus.exams.document-link-ttl=PT5M

# --- SUS Nexus — hospital / pós-alta (HOS-005, CUI-006) ---
# capítulos/intervalos CID-10 classificados highly_restricted (F = saúde mental, B20-B24 = HIV, O = gestação)
sus.privacy.highly-restricted-cid-prefixes=F,B20-B24,O
# risco pós-alta: platform.rule_set 'post-discharge-risk' (versão vigente lida a cada alta);
# prazos de contato em tasks.sla_policy (post_discharge_followup × prioridade = risco)

# --- SUS Nexus — planos de cuidado (CUI-003/004) ---
# varredura diária de lacunas (CareGapDetectionJob); invocável via CareGapDetectionJob.runOnce()
sus.careplan.gap-detection-cron=0 15 3 * * ?

# --- SUS Nexus — produção (PRO-001..010) ---
# pré-auditoria: platform.rule_set 'production-validation' (versão vigente lida a cada validação);
# prazos por competência em production.production_deadline (seed: dia 10 do mês seguinte); padrão
# quando não há linha para a competência:
sus.production.deadline-day=10
sus.production.deadline-zone=America/Sao_Paulo
# alertas D-5/D-1 (CompetenceDeadlineJob; invocável via runOnce(Instant))
sus.production.deadline-alert-cron=0 5 7 * * ?
# armazenamento dos arquivos de exportação: file (FileExportStorage, padrão dev/test) | s3 (S3ExportStorage,
# MinIO/S3 com SSE). O arquivo contém CNS em claro: diretório/bucket com acesso restrito à credencial do core.
sus.production.export-storage=${SUS_PRODUCTION_EXPORT_STORAGE:file}
sus.production.export-dir=${SUS_PRODUCTION_EXPORT_DIR:${java.io.tmpdir}/sus-nexus/production-exports}
sus.production.s3.bucket=${SUS_PRODUCTION_S3_BUCKET:production-exports}
sus.production.s3.region=${SUS_PRODUCTION_S3_REGION:us-east-1}
sus.production.s3.endpoint=${SUS_PRODUCTION_S3_ENDPOINT:}
sus.production.s3.path-style=${SUS_PRODUCTION_S3_PATH_STYLE:true}
sus.production.s3.access-key=${SUS_PRODUCTION_S3_ACCESS_KEY:}
sus.production.s3.secret-key=${SUS_PRODUCTION_S3_SECRET_KEY:}
sus.production.s3.prefix=${SUS_PRODUCTION_S3_PREFIX:}
# AES256 (SSE-S3 / MinIO KMS) | aws:kms (+ kms-key-id) | none (somente dev sem KMS)
sus.production.s3.sse=${SUS_PRODUCTION_S3_SSE:AES256}
sus.production.s3.kms-key-id=${SUS_PRODUCTION_S3_KMS_KEY_ID:}
sus.production.export-origin-name=${SUS_PRODUCTION_EXPORT_ORIGIN_NAME:SECRETARIA MUNICIPAL DE SAUDE}
sus.production.export-origin-acronym=${SUS_PRODUCTION_EXPORT_ORIGIN_ACRONYM:SMS}
sus.production.export-origin-document=${SUS_PRODUCTION_EXPORT_ORIGIN_DOCUMENT:00000000000000}

# --- SUS Nexus — Temporal (conexão real só com enabled=true) ---
sus.temporal.enabled=false
sus.temporal.target=${TEMPORAL_TARGET:localhost:7233}
sus.temporal.namespace=${TEMPORAL_NAMESPACE:default}
sus.temporal.task-queue=tasks

# --- SUS Nexus — outbox relay de desenvolvimento (produção: Debezium Outbox Event Router) ---
sus.outbox.relay.enabled=false
sus.outbox.relay.every=5s
sus.outbox.relay.batch-size=100

# --- Kafka (SmallRye Reactive Messaging) ---
# Canais ← tópicos (contracts/events/topics.yaml). Valores em String (envelope JSON).
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
quarkus.kafka.devservices.enabled=false
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.connector.smallrye-kafka.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.failure-strategy=dead-letter-queue
mp.messaging.connector.smallrye-kafka.dead-letter-queue.topic=sus.dlq.v1

