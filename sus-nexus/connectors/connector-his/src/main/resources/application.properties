quarkus.application.name=connector-his
quarkus.http.port=8096
quarkus.banner.enabled=false
quarkus.log.console.filter=pii-mask
%prod.quarkus.log.console.json=true

connector.tenant-id=${TENANT_ID:ibge_3143302}
# Conector de borda: roda dentro do hospital, só sai para o barramento (mTLS). Afeta documentação/healthcheck.
connector.edge=${CONNECTOR_EDGE:true}
quarkus.rest-client.core.url=${CORE_URL:http://localhost:8080}
quarkus.rest-client.core.connect-timeout=5000
quarkus.rest-client.core.read-timeout=60000
# mTLS de saída (prod): keystore/truststore do hospital emitidos pela PKI do barramento.
# Descomente/forneça via variáveis quando o core exigir certificado de cliente:
#%prod.quarkus.rest-client.core.key-store=${CORE_MTLS_KEYSTORE}
#%prod.quarkus.rest-client.core.key-store-password=${CORE_MTLS_KEYSTORE_PASSWORD}
#%prod.quarkus.rest-client.core.trust-store=${CORE_MTLS_TRUSTSTORE}
#%prod.quarkus.rest-client.core.trust-store-password=${CORE_MTLS_TRUSTSTORE_PASSWORD}
connector.core.auth.mode=${CORE_AUTH_MODE:static}
connector.core.auth.static-token=${CORE_STATIC_TOKEN:dev-token}
quarkus.oidc-client.enabled=false
%prod.connector.core.auth.mode=oidc
%prod.quarkus.oidc-client.enabled=true
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/sus-nexus
%prod.quarkus.oidc-client.client-id=${CORE_CLIENT_ID:connector-his}
%prod.quarkus.oidc-client.credentials.secret=${CORE_CLIENT_SECRET:}
%prod.quarkus.oidc-client.grant.type=client

connector.raw-store.type=${RAW_STORE_TYPE:file}
connector.raw-store.dir=${RAW_STORE_DIR:data/raw-zone}
connector.raw-store.bucket=${RAW_STORE_BUCKET:sus-nexus-raw}
connector.raw-store.endpoint=${RAW_STORE_ENDPOINT:http://localhost:9000}
connector.ledger.type=memory
connector.dlq.dir=${DLQ_DIR:data/dlq}
connector.retry.max-attempts=5
connector.retry.initial-backoff=PT2S
connector.retry.max-backoff=PT5M

# HL7 v2.x ADT: MLLP (listener) e/ou arquivos .hl7
his.source-version=${HIS_VERSION:HIS genérico HL7 v2.3–2.5.1 (ADT)}
# Perfil de fornecedor: generic | tasy | mv | aghuse (troca só mappings/<vendor>/*.yaml)
his.vendor=${HIS_VENDOR:generic}
his.charset=${HIS_CHARSET:ISO-8859-1}
his.zone=${HIS_ZONE:America/Sao_Paulo}
his.mllp.enabled=${HIS_MLLP_ENABLED:true}
his.mllp.host=${HIS_MLLP_HOST:0.0.0.0}
his.mllp.port=${HIS_MLLP_PORT:2576}
his.mllp.receive-timeout-ms=30000
his.file.input-dir=${HIS_INPUT_DIR:data/his/in}
his.file.poll-delay-ms=5000
# PID-3: tipo (CX-5) usado pelo HIS para CNS/CPF; inferência por tamanho quando sem tipo
his.pid.cns-identifier-type=${HIS_PID_CNS_TYPE:CNS}
his.pid.cpf-identifier-type=${HIS_PID_CPF_TYPE:CPF}
his.pid.infer-by-length=${HIS_PID_INFER_BY_LENGTH:true}
his.pid.local-identifier-system=${HIS_PID_LOCAL_SYSTEM:HIS}
# Hospital: CNES fixo (senão MSH-4 / PV1-3-4); classe do A04 quando PV1-2 não é O
his.hospital.cnes=${HIS_HOSPITAL_CNES}
his.hospital.a04-patient-class=${HIS_A04_PATIENT_CLASS:E}
# AIH: none | pv1-50 | zai (campo his.aih.zai-field, ex.: zai.2)
his.aih.source=${HIS_AIH_SOURCE:none}
his.aih.zai-field=${HIS_AIH_ZAI_FIELD:zai.2}
# Nº da solicitação de regulação: none | pv1-5 | <campo plano, ex.: zrg.2>
his.regulation.source=${HIS_REGULATION_SOURCE:pv1-5}
# DG1-6 preferido para diagnóstico principal (admissão / alta)
his.diagnosis.admit-type=${HIS_DG1_ADMIT_TYPE:A}
his.diagnosis.discharge-type=${HIS_DG1_DISCHARGE_TYPE:F}
his.discharge.summary-ref-from-raw=${HIS_SUMMARY_REF_FROM_RAW:true}

quarkus.micrometer.export.prometheus.enabled=true
%dev.quarkus.log.category."br.gov.sus.nexus".level=DEBUG

%test.quarkus.http.test-port=0
%test.his.mllp.enabled=false
%test.his.charset=UTF-8
%test.his.file.input-dir=target/test-input/his
%test.his.file.poll-delay-ms=200
%test.his.aih.source=zai
%test.connector.raw-store.dir=target/test-raw-zone
%test.connector.dlq.dir=target/test-dlq
%test.connector.retry.initial-backoff=PT0.01S
%test.connector.retry.max-backoff=PT0.05S
%test.connector.core.auth.static-token=test-token
%test.quarkus.rest-client.core.url=http://localhost:${wiremock.port:8089}
%test.Retry/delay=10
%test.Retry/maxRetries=1
%test.CircuitBreaker/enabled=false
