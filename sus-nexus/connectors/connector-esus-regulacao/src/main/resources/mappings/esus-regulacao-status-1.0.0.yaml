# Evento/mudança de status da API do e-SUS Regulação → RegulationStatusChange, publicado em
# POST /api/v1/regulation/requests/by-source/ESUS_REGULACAO/{target_ref.source_record_id}/status.
# Caminhos de origem são HIPÓTESE DE HOMOLOGAÇÃO.
mapping_set: esus-regulacao-status
version: "1.0.0"
entity_type: regulation_status
lookups:
  situacao:
    PENDENTE: requested
    SOLICITADA: requested
    PENDENTE_DOCUMENTO: pending_documents
    PENDENCIA: pending_documents
    DEVOLVIDA: returned
    DEVOLVIDO: returned
    EM_ANALISE: under_review
    EM_REGULACAO: under_review
    AUTORIZADA: authorized
    AUTORIZADO: authorized
    NEGADA: denied
    NEGADO: denied
    AGENDADA: scheduled
    AGENDADO: scheduled
    REMARCADA: scheduled
    CANCELADA: cancelled
    CANCELADO: cancelled
    FALTA: no_show
    NAO_COMPARECEU: no_show
    REALIZADA: performed
    REALIZADO: performed
    VENCIDA: expired
    EXPIRADA: expired
  prioridade:
    VERMELHO: emergency
    VERMELHA: emergency
    AMARELO: urgent
    AMARELA: urgent
    VERDE: priority
    AZUL: elective
fields:
  - { target: target_ref.system, constant: ESUS_REGULACAO }
  - { source: solicitacao.id, target: target_ref.source_record_id, transforms: [trim], required: true }
  - { target: source.system, constant: ESUS_REGULACAO }
  - { target: source.connector, constant: connector-esus-regulacao }
  - { source: id, target: source.source_record_id, transforms: [trim], required: true }
  - { source: atualizado_em, target: source.source_record_version, transforms: [trim, blank_to_null] }
  - { source: unidade_executante.cnes, target: source.cnes, transforms: [digits, blank_to_null] }
  - { source: situacao, target: status, transforms: [trim, unaccent, upper, { regex: { pattern: "[^A-Z0-9]+", replacement: "_" } }, { lookup: { table: situacao, strict: true } }], required: true }
  - { source: prioridade, target: priority, transforms: [trim, unaccent, upper, blank_to_null, { lookup: { table: prioridade } }] }
  - { source: data, target: occurred_at, transforms: [{ date: { from: "yyyy-MM-dd'T'HH:mm:ss|yyyy-MM-dd HH:mm:ss|yyyy-MM-dd|dd/MM/yyyy HH:mm:ss|dd/MM/yyyy", to: iso-datetime } }], required: true }
  - { source: unidade_executante.cnes, target: provider_cnes, transforms: [digits, blank_to_null] }
  - { source: data_agendamento, target: scheduled_at, transforms: [blank_to_null, { date: { from: "yyyy-MM-dd'T'HH:mm:ss|yyyy-MM-dd HH:mm:ss|yyyy-MM-dd|dd/MM/yyyy HH:mm:ss|dd/MM/yyyy", to: iso-datetime } }] }
  - { source: agendamento.id, target: appointment_source_record_id, transforms: [trim, blank_to_null] }
  - { source: regulador.id, target: regulator_id, transforms: [trim, blank_to_null] }
  - { source: motivo, target: reason, transforms: [trim, blank_to_null, { substring: { start: 0, end: 500 } }] }
  - { source: retorno_origem, target: return_to_origin, transforms: [blank_to_null, { to_boolean: { true_values: ["TRUE", "1", "S", "SIM"] } }] }
