quarkus.application.name=connector-esus-regulacao
quarkus.http.port=8094
quarkus.banner.enabled=false
quarkus.log.console.filter=pii-mask
%prod.quarkus.log.console.json=true

connector.tenant-id=${TENANT_ID:ibge_3143302}
quarkus.rest-client.core.url=${CORE_URL:http://localhost:8080}
quarkus.rest-client.core.connect-timeout=5000
quarkus.rest-client.core.read-timeout=60000
connector.core.auth.mode=${CORE_AUTH_MODE:static}
connector.core.auth.static-token=${CORE_STATIC_TOKEN:dev-token}
quarkus.oidc-client.enabled=false
%prod.connector.core.auth.mode=oidc
%prod.quarkus.oidc-client.enabled=true
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/sus-nexus
%prod.quarkus.oidc-client.client-id=${CORE_CLIENT_ID:connector-esus-regulacao}
%prod.quarkus.oidc-client.credentials.secret=${CORE_CLIENT_SECRET:}
%prod.quarkus.oidc-client.grant.type=client

connector.raw-store.type=${RAW_STORE_TYPE:file}
connector.raw-store.dir=${RAW_STORE_DIR:data/raw-zone}
connector.raw-store.bucket=${RAW_STORE_BUCKET:sus-nexus-raw}
connector.raw-store.endpoint=${RAW_STORE_ENDPOINT:http://localhost:9000}
connector.ledger.type=memory
connector.dlq.dir=${DLQ_DIR:data/dlq}
connector.retry.max-attempts=5
connector.retry.initial-backoff=PT2S
connector.retry.max-backoff=PT5M

# Modo: api (REST paginado, OAuth2 client credentials) | file (exportação JSON/CSV; sempre ativo)
esus.mode=${ESUS_MODE:file}
esus.source-version=${ESUS_VERSION:e-SUS Regulação (API em homologação)}
# --- API (rotas, parâmetros e caminhos JSON dependem da homologação) ---
esus.api.base-url=${ESUS_API_URL:http://localhost:9080}
esus.api.auth-mode=${ESUS_AUTH_MODE:oauth2}
esus.api.token-url=${ESUS_TOKEN_URL:http://localhost:9080/oauth/token}
esus.api.client-id=${ESUS_CLIENT_ID:sus-nexus}
esus.api.client-secret=${ESUS_CLIENT_SECRET}
esus.api.scope=${ESUS_SCOPE:regulacao.read}
esus.api.static-token=${ESUS_STATIC_TOKEN}
esus.api.requests-path=${ESUS_REQUESTS_PATH:/api/v1/regulacao/solicitacoes}
esus.api.events-path=${ESUS_EVENTS_PATH:/api/v1/regulacao/eventos}
esus.api.updated-since-param=${ESUS_UPDATED_SINCE_PARAM:updated_since}
esus.api.pagination=${ESUS_PAGINATION:page}
esus.api.page-param=${ESUS_PAGE_PARAM:page}
esus.api.first-page=${ESUS_FIRST_PAGE:1}
esus.api.page-size-param=${ESUS_PAGE_SIZE_PARAM:size}
esus.api.page-size=${ESUS_PAGE_SIZE:100}
esus.api.cursor-param=${ESUS_CURSOR_PARAM:cursor}
esus.api.items-path=${ESUS_ITEMS_PATH:items}
esus.api.next-cursor-path=${ESUS_NEXT_CURSOR_PATH:next_cursor}
esus.api.updated-at-path=${ESUS_UPDATED_AT_PATH:atualizado_em}
esus.api.request-id-path=${ESUS_REQUEST_ID_PATH:id}
esus.api.event-id-path=${ESUS_EVENT_ID_PATH:id}
esus.api.poll-interval-ms=${ESUS_POLL_INTERVAL_MS:300000}
esus.api.initial-delay-ms=5000
esus.api.watermark-file=${ESUS_WATERMARK_FILE:data/esus-regulacao/watermark.json}
esus.api.initial-watermark=${ESUS_INITIAL_WATERMARK:1970-01-01T00:00:00Z}
esus.api.timeout-ms=30000
# --- file ---
esus.file.input-dir=${ESUS_INPUT_DIR:data/esus-regulacao/in}
esus.file.charset=UTF-8
esus.file.delimiter=;
esus.file.poll-delay-ms=5000

quarkus.micrometer.export.prometheus.enabled=true
%dev.quarkus.log.category."br.gov.sus.nexus".level=DEBUG

%test.quarkus.http.test-port=0
%test.esus.mode=api
%test.esus.api.base-url=http://localhost:${wiremock.port:8089}/esus
%test.esus.api.token-url=http://localhost:${wiremock.port:8089}/esus/oauth/token
%test.esus.api.client-id=sus-nexus-test
%test.esus.api.client-secret=segredo
%test.esus.api.page-size=2
%test.esus.api.poll-interval-ms=400
%test.esus.api.initial-delay-ms=300
%test.esus.api.watermark-file=target/test-input/esus-watermark.json
%test.esus.file.input-dir=target/test-input/esus
%test.esus.file.poll-delay-ms=200
%test.connector.raw-store.dir=target/test-raw-zone
%test.connector.dlq.dir=target/test-dlq
%test.connector.retry.initial-backoff=PT0.01S
%test.connector.retry.max-backoff=PT0.05S
%test.connector.core.auth.static-token=test-token
%test.quarkus.rest-client.core.url=http://localhost:${wiremock.port:8089}
%test.Retry/delay=10
%test.Retry/maxRetries=1
%test.CircuitBreaker/enabled=false
