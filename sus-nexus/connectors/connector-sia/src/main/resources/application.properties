quarkus.application.name=connector-sia
quarkus.http.port=8099
quarkus.banner.enabled=false
quarkus.log.console.filter=pii-mask
%prod.quarkus.log.console.json=true

connector.tenant-id=${TENANT_ID:ibge_3143302}
# Core: só operação de integração (ledger espelho, heartbeat, reconciliação). A produção vai pelo Kafka.
quarkus.rest-client.core.url=${CORE_URL:http://localhost:8080}
quarkus.rest-client.core.connect-timeout=5000
quarkus.rest-client.core.read-timeout=30000
connector.core.auth.mode=${CORE_AUTH_MODE:static}
connector.core.auth.static-token=${CORE_STATIC_TOKEN:dev-token}
connector.core.mirror.enabled=${CORE_MIRROR_ENABLED:true}
# cada linha (publicada ou DLQ) é espelhada no core → reprocessável pela tela /integracoes
connector.core.mirror.pipeline-messages=true
quarkus.oidc-client.enabled=false
%prod.connector.core.auth.mode=oidc
%prod.quarkus.oidc-client.enabled=true
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/sus-nexus
%prod.quarkus.oidc-client.client-id=${CORE_CLIENT_ID:connector-sia}
%prod.quarkus.oidc-client.credentials.secret=${CORE_CLIENT_SECRET:}
%prod.quarkus.oidc-client.grant.type=client

connector.raw-store.type=${RAW_STORE_TYPE:file}
connector.raw-store.dir=${RAW_STORE_DIR:data/raw-zone}
connector.raw-store.bucket=${RAW_STORE_BUCKET:sus-nexus-raw}
connector.raw-store.endpoint=${RAW_STORE_ENDPOINT:http://localhost:9000}
connector.ledger.type=${LEDGER_TYPE:memory}
connector.dlq.dir=${DLQ_DIR:data/dlq}
connector.retry.max-attempts=5
connector.retry.initial-backoff=PT2S
connector.retry.max-backoff=PT5M

# Datasource (opcional): só com connector.ledger.type=jdbc (DB_ACTIVE=true; DDL do SDK criada se ausente)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=${DB_ACTIVE:false}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sus_nexus_connectors}
quarkus.datasource.username=${DB_USER:connector_sia}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.health.enabled=false

# Pastas monitoradas (SFTP montado): exportações de produção do sistema de origem e retornos SIA/SIH
sia.file.production-dir=${SIA_PRODUCTION_DIR:data/sia/producao}
sia.file.returns-dir=${SIA_RETURNS_DIR:data/sia/retornos}
sia.file.charset=${SIA_CHARSET:UTF-8}
sia.file.poll-delay-ms=5000
sia.file.processed-registry=${SIA_PROCESSED_REGISTRY:data/sia/processed-files.json}
# Layout versionado (YAML). Retornos SIA/SIH marcados "A CONFIRMAR" até a homologação.
sia.layout=${SIA_LAYOUT:classpath:layouts/sia-layouts.yaml}
sia.mapping.record=mappings/sia-production-record-1.0.0.yaml
sia.mapping.outcome=mappings/sia-production-outcome-1.1.0.yaml
sia.publish.topic=sus.ingest.production.v1
sia.publish.ack-timeout=PT30S
sia.heartbeat.enabled=true
sia.heartbeat.period-ms=60000
sia.reconciliation.enabled=true
sia.reconciliation.period-ms=3600000
sia.reconciliation.window=P1D

# Kafka: produção em sus.ingest.production.v1 (chave source.source_record_id) e comandos do core
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.ssl.keystore.location=${KAFKA_SSL_KEYSTORE_LOCATION:}
kafka.ssl.keystore.password=${KAFKA_SSL_KEYSTORE_PASSWORD:}
kafka.ssl.keystore.type=${KAFKA_SSL_KEYSTORE_TYPE:PKCS12}
kafka.ssl.truststore.location=${KAFKA_SSL_TRUSTSTORE_LOCATION:}
kafka.ssl.truststore.password=${KAFKA_SSL_TRUSTSTORE_PASSWORD:}
kafka.ssl.truststore.type=${KAFKA_SSL_TRUSTSTORE_TYPE:PKCS12}
mp.messaging.outgoing.ingest-production-out.connector=smallrye-kafka
mp.messaging.outgoing.ingest-production-out.topic=${sia.publish.topic}
mp.messaging.outgoing.ingest-production-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ingest-production-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.ingest-production-out.acks=all
mp.messaging.outgoing.ingest-production-out.enable.idempotence=true
mp.messaging.incoming.sia-integration-command.connector=smallrye-kafka
mp.messaging.incoming.sia-integration-command.topic=sus.integration.command.v1
mp.messaging.incoming.sia-integration-command.group.id=${SIA_CONSUMER_GROUP:connector-sia}
mp.messaging.incoming.sia-integration-command.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sia-integration-command.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.sia-integration-command.auto.offset.reset=latest
mp.messaging.incoming.sia-integration-command.enable.auto.commit=false
mp.messaging.incoming.sia-integration-command.failure-strategy=ignore

quarkus.micrometer.export.prometheus.enabled=true
%dev.quarkus.log.category."br.gov.sus.nexus".level=DEBUG

# ------------------------------------------------------------------------------------------------
# Testes: WireMock (porta dinâmica) no lugar do core; Kafka em memória.
# ------------------------------------------------------------------------------------------------
%test.quarkus.http.test-port=0
%test.mp.messaging.outgoing.ingest-production-out.connector=smallrye-in-memory
%test.mp.messaging.incoming.sia-integration-command.connector=smallrye-in-memory
%test.sia.file.production-dir=target/test-input/sia/producao
%test.sia.file.returns-dir=target/test-input/sia/retornos
%test.sia.file.poll-delay-ms=200
%test.sia.file.processed-registry=target/test-input/sia-processed.json
%test.sia.publish.ack-timeout=PT5S
%test.sia.heartbeat.enabled=false
%test.sia.reconciliation.enabled=false
%test.connector.raw-store.dir=target/test-raw-zone
%test.connector.dlq.dir=target/test-dlq
%test.connector.retry.max-attempts=3
%test.connector.retry.initial-backoff=PT0.01S
%test.connector.retry.max-backoff=PT0.05S
%test.connector.core.auth.static-token=test-token
%test.quarkus.rest-client.core.url=http://localhost:${wiremock.port:8089}
%test.Retry/delay=10
%test.Retry/maxRetries=1
%test.CircuitBreaker/enabled=false
