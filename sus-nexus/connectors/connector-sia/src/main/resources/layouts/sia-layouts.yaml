# Layout dos arquivos do connector-sia (versionado; aponte outro com SIA_LAYOUT=/caminho/layout.yaml).
#
# group: producao → pasta sia.file.production-dir (exportações de produção do sistema de origem)
#        retorno  → pasta sia.file.returns-dir    (retornos de processamento SIA/SIH)
# format: delimited (cabeçalho na 1ª linha; cabeçalhos normalizados — minúsculas, sem acento,
#         não alfanuméricos → "_" — e resolvidos por aliases, o primeiro preenchido vence)
#       | fixed-width (posições 1-based inclusivas; line_filter seleciona as linhas de detalhe)
# source_system: valor de source.system (produção: pode ser sobrescrito pela coluna sistema_origem)
# id_column: identificador estável do registro na fonte (senão "<sha256 do arquivo[0:16]>:<linha>")
# Idempotência: event_id = f(kind, SHA-256 do arquivo, nº da linha) — reenvio/reprocessamento é
# descartado pelo event_inbox do core; o mesmo arquivo (mesmo SHA-256) nunca é relido.
version: "1.0.0"
kinds:
  # ------------------------------------------------------------------------------------------
  # Exportação de produção do sistema de origem (PEC/HIS/sistema próprio) — BPA-C, BPA-I, APAC, AIH.
  # Uma linha = um registro de produção (ProductionRecordRegistration). Ajuste os aliases ao export
  # do seu sistema; mantenha os nomes canônicos (chaves).
  - name: producao
    group: producao
    entity: production_record
    status: homologado
    file_pattern: "(?i).*\\.(csv|txt)"
    format: delimited
    delimiter: ";"
    charset: UTF-8
    source_system: PRODUCAO_MUNICIPAL
    id_column: id_registro
    version_column: data_atualizacao
    defaults: { quantidade: "1" }
    columns:
      id_registro: [id_registro, id, codigo_registro, numero_registro, chave, id_producao]
      data_atualizacao: [data_atualizacao, dt_atualizacao, atualizado_em, versao]
      sistema_origem: [sistema_origem, sistema, origem]
      instrumento: [instrumento, tipo_registro, tipo, instrumento_registro, tp_registro]
      competencia: [competencia, cmp, mes_competencia, competencia_aaaamm, prd_cmp]
      cnes: [cnes, cnes_estabelecimento, cnes_unidade, estabelecimento_cnes, cnes_executante]
      cns_profissional: [cns_profissional, cns_do_profissional, prof_cns, cns_medico]
      cbo: [cbo, cbo_profissional, ocupacao, cbo_do_profissional]
      procedimento: [procedimento, codigo_procedimento, cod_procedimento, procedimento_sigtap, sigtap, co_procedimento]
      quantidade: [quantidade, qtd, qtde, quantidade_apresentada, qt_apresentada]
      id_cidadao: [id_cidadao, municipal_citizen_id, cidadao_id]
      cns_paciente: [cns_paciente, cns_usuario, cns_cidadao, cns_do_paciente, cns]
      cpf_paciente: [cpf_paciente, cpf_usuario, cpf_cidadao, cpf_do_paciente, cpf]
      cid: [cid, cid10, cid_10, cid_principal, codigo_cid]
      data_atendimento: [data_atendimento, dt_atendimento, data_realizacao, data_procedimento, data_do_atendimento]
      carater_atendimento: [carater_atendimento, carater, caracter_atendimento, carater_do_atendimento]
      numero_apac: [numero_apac, apac, num_apac, autorizacao_apac, nu_apac]
      numero_aih: [numero_aih, aih, num_aih, autorizacao_aih, nu_aih]
      id_atendimento: [id_atendimento, atendimento_origem, id_atendimento_origem]
      id_agendamento: [id_agendamento, agendamento_origem, id_agendamento_origem]
      id_internacao: [id_internacao, internacao_origem, numero_atendimento_hospitalar]

  # ------------------------------------------------------------------------------------------
  # Retornos de processamento oficial — LAYOUTS "A CONFIRMAR" até a homologação com o faturamento
  # municipal/DATASUS (nomes de arquivo, colunas, códigos de situação e de motivo, casas decimais).
  # Uma linha = um retorno (ProductionOutcomeRegistration). Alvo (exatamente um, nesta precedência):
  # id do barramento (prod_…) → registro de origem (sistema_origem_registro + id_registro_origem) → lote.
  - name: retorno_sia_csv
    group: retorno
    entity: production_outcome
    status: A CONFIRMAR
    file_pattern: "(?i).*(sia|bpa|apac).*\\.csv"
    format: delimited
    delimiter: ";"
    charset: ISO-8859-1
    source_system: SIA
    id_column: id_retorno
    defaults: { sistema_origem_registro: PRODUCAO_MUNICIPAL }
    columns:
      id_retorno: [id_retorno, sequencial_retorno, id_linha_retorno]
      situacao: [situacao, status, resultado, situacao_processamento, situacao_registro]
      id_registro_barramento: [id_registro_barramento, production_record_id, id_sus_nexus, id_barramento]
      sistema_origem_registro: [sistema_origem_registro, sistema_origem]
      id_registro_origem: [id_registro_origem, id_registro, registro_origem]
      lote: [lote, id_lote, batch_id]
      competencia: [competencia, cmp]
      data_processamento: [data_processamento, dt_processamento, data_retorno, processado_em]
      codigo_motivo: [codigo_motivo, cod_motivo, codigo_glosa, codigo_erro, codigo_critica]
      motivo: [motivo, descricao_motivo, descricao_glosa, mensagem, critica, descricao_critica]
      valor_pago: [valor_pago, vl_pago, valor_aprovado, vl_aprovado]
      quantidade_aprovada: [quantidade_aprovada, qtd_aprovada, qtde_aprovada, qt_aprovada]
      protocolo: [protocolo, numero_protocolo, nu_protocolo]

  # SIH: arquivo texto de largura fixa (detalhe = tipo "02"; "01" cabeçalho e "99" rodapé ignorados).
  # Situação em 2 letras (PG pago, AP aprovado, RJ rejeitado, GL glosado) e valor com 2 casas
  # implícitas. O alvo é o nº da AIH como registro de origem (o sistema hospitalar exporta a AIH
  # com id_registro = nº da AIH) — A CONFIRMAR.
  - name: retorno_sih_txt
    group: retorno
    entity: production_outcome
    status: A CONFIRMAR
    file_pattern: "(?i).*sih.*\\.txt"
    format: fixed-width
    charset: ISO-8859-1
    source_system: SIH
    line_filter: { start: 1, end: 2, equals: "02" }
    defaults: { sistema_origem_registro: HIS, valor_casas_implicitas: "2" }
    columns:
      id_registro_origem: { start: 3, end: 15 }
      competencia: { start: 16, end: 21 }
      data_processamento: { start: 22, end: 29 }
      situacao: { start: 30, end: 31 }
      codigo_motivo: { start: 32, end: 35 }
      valor_pago: { start: 36, end: 47 }
      quantidade_aprovada: { start: 48, end: 53 }
      protocolo: { start: 54, end: 69 }
      motivo: { start: 70, end: 129 }
