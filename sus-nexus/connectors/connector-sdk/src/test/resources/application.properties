quarkus.http.test-port=0
connector.tenant-id=ibge_3143302
connector.raw-store.dir=target/test-raw-zone
connector.dlq.dir=target/test-dlq
connector.retry.max-attempts=3
connector.retry.initial-backoff=PT0.01S
connector.retry.max-backoff=PT0.05S
connector.core.auth.mode=static
connector.core.auth.static-token=test-token
quarkus.rest-client.core.url=http://localhost:${wiremock.port:8089}
quarkus.oidc-client.enabled=false
quarkus.log.console.filter=pii-mask
# retry do cliente REST: rápido em teste
Retry/delay=10
Retry/jitter=5
Retry/maxRetries=1
CircuitBreaker/enabled=false
# espelhamento no core (usado pelo reprocessamento); o runtime não espelha cada mensagem
connector.core.mirror.enabled=true
