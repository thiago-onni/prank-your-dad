# Modelo de informação RNDS: Sumário de Alta — mapeamento declarativo versionado.
#
# ATENÇÃO: perfis, códigos e forma do Bundle são EXEMPLOS "A CONFIRMAR" com a documentação oficial
# vigente da RNDS e a habilitação do município (ver README). Modelo desabilitado por padrão
# (rnds.models.sumario-alta.enabled=false).
model: sumario-alta
version: 1.0.0
status: a-confirmar-na-homologacao
description: >-
  Encounter finalizado (alta) do fhir-gateway + diagnóstico principal CID-10 do evento
  sus.hospital.discharge.v1 (action=completed), enviados como Bundle document à RNDS.

bundle:
  type: document
  profile: null
  identifier_system: "http://www.saude.gov.br/fhir/r4/NamingSystem/BRRNDS-{solicitante}"

composition:
  profile: "http://www.saude.gov.br/fhir/r4/StructureDefinition/BRSumarioAlta-A-CONFIRMAR"
  type:
    system: "http://www.saude.gov.br/fhir/r4/CodeSystem/BRTipoDocumento"
    code: "SA"
    display: "Sumário de Alta"
  category: null
  title: "Sumário de Alta"
  section_title: "Internação"

identifier_systems:
  cns: "http://rnds.saude.gov.br/fhir/r4/NamingSystem/cns"
  cpf: "http://rnds.saude.gov.br/fhir/r4/NamingSystem/cpf"
  cnes: "http://rnds.saude.gov.br/fhir/r4/NamingSystem/cnes"

code_systems:                         # A CONFIRMAR: CodeSystem oficial da CID-10 na RNDS
  cid10: "http://www.saude.gov.br/fhir/r4/CodeSystem/BRCID10"

resources:
  Encounter:
    mode: entry
    profile: "http://www.saude.gov.br/fhir/r4/StructureDefinition/BRContatoAssistencial-A-CONFIRMAR"
  Condition:
    mode: entry
    profile: "http://www.saude.gov.br/fhir/r4/StructureDefinition/BRProblemaDiagnostico-A-CONFIRMAR"
  Patient:
    mode: logical
    profile: null
  Organization:
    mode: logical
    profile: null

strip:
  extension_prefixes:
    - "http://sus-nexus.gov.br/fhir"
    - "https://sus-nexus.gov.br/fhir"
  identifier_prefixes:
    - "http://sus-nexus.gov.br/fhir"
    - "https://sus-nexus.gov.br/fhir"
  elements:
    - Encounter.basedOn
    - Encounter.location
    - Encounter.reasonCode

required:
  - name: patient_identifier
    check: cns_or_cpf
    facts: [patient.cns, patient.cpf]
  - name: hospital_cnes
    check: cnes
    facts: [hospital.cnes]
  - name: admission_date
    check: datetime
    facts: [encounter.start]
  - name: discharge_date
    check: datetime
    facts: [encounter.end]
  - name: principal_diagnosis
    check: present
    facts: [diagnosis.code]
  - name: finished_status
    check: one_of
    facts: [encounter.status]
    values: [finished]
