quarkus.application.name=connector-rnds
quarkus.http.port=8098
quarkus.banner.enabled=false
quarkus.log.console.filter=pii-mask
%prod.quarkus.log.console.json=true

connector.tenant-id=${TENANT_ID:ibge_3143302}
quarkus.rest-client.core.url=${CORE_URL:http://localhost:8080}
quarkus.rest-client.core.connect-timeout=5000
quarkus.rest-client.core.read-timeout=60000
connector.core.auth.mode=${CORE_AUTH_MODE:static}
connector.core.auth.static-token=${CORE_STATIC_TOKEN:dev-token}
quarkus.oidc-client.enabled=false
%prod.connector.core.auth.mode=oidc
%prod.quarkus.oidc-client.enabled=true
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/sus-nexus
%prod.quarkus.oidc-client.client-id=${CORE_CLIENT_ID:connector-rnds}
%prod.quarkus.oidc-client.credentials.secret=${CORE_CLIENT_SECRET:}
%prod.quarkus.oidc-client.grant.type=client

connector.raw-store.type=${RAW_STORE_TYPE:file}
connector.raw-store.dir=${RAW_STORE_DIR:data/raw-zone}
connector.raw-store.bucket=${RAW_STORE_BUCKET:sus-nexus-raw}
connector.raw-store.endpoint=${RAW_STORE_ENDPOINT:http://localhost:9000}
connector.ledger.type=${LEDGER_TYPE:memory}
connector.dlq.dir=${DLQ_DIR:data/dlq}
# 5xx/timeout da RNDS: backoff exponencial 5s → 10s → 20s → 40s (máx. 10 min); 4xx nunca repete
connector.retry.max-attempts=${RNDS_RETRY_MAX_ATTEMPTS:5}
connector.retry.initial-backoff=PT5S
connector.retry.multiplier=2.0
connector.retry.max-backoff=PT10M

# Datasource (opcional): só necessário com connector.ledger.type=jdbc ou rnds.submission-store.type=jdbc
# (ative com DB_ACTIVE=true; a tabela rnds_submission é criada se ausente — db/rnds_submission.sql)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=${DB_ACTIVE:false}
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/sus_nexus_connectors}
quarkus.datasource.username=${DB_USER:connector_rnds}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.health.enabled=false

# ------------------------------------------------------------------------------------------------
# RNDS — TODOS OS ENDEREÇOS/CABEÇALHOS/PERFIS ABAIXO SÃO EXEMPLOS "A CONFIRMAR NA HOMOLOGAÇÃO"
# com a documentação oficial vigente da RNDS e a habilitação efetiva do município (ver README).
# ------------------------------------------------------------------------------------------------
# Serviço de autenticação (token obtido com o certificado ICP-Brasil e-CNPJ via mTLS) — EXEMPLO
rnds.auth-url=${RNDS_AUTH_URL:https://ehr-auth-hmg.saude.gov.br/api/token}
rnds.auth.method=${RNDS_AUTH_METHOD:GET}
rnds.auth.token-field=access_token
rnds.auth.expires-in-field=expires_in
rnds.auth.default-ttl=PT25M
rnds.auth.refresh-skew=PT60S
# Serviço EHR (POST do Bundle em {ehr-url}{ehr-path}) — EXEMPLO (endereço varia por ambiente/UF)
rnds.ehr-url=${RNDS_EHR_URL:https://ehr-services-hmg.saude.gov.br/api}
# Profissional responsável (CPF) e estabelecimento solicitante (CNES) — informados na habilitação
rnds.requester-cpf=${RNDS_REQUESTER_CPF:}
rnds.cnes-solicitante=${RNDS_CNES_SOLICITANTE:}
rnds.solicitante-id=${RNDS_SOLICITANTE_ID:}
# Cabeçalhos exigidos pela RNDS — A CONFIRMAR
rnds.headers.token=X-Authorization-Server
rnds.headers.token-scheme=Bearer
rnds.headers.requester=Authorization
rnds.headers.content-type=application/fhir+json
rnds.timeout=PT30S
# Certificado ICP-Brasil (PKCS#12). Em produção: arquivo montado pelo External Secrets a partir do OpenBao
rnds.certificate.keystore-path=${RNDS_KEYSTORE_PATH:}
rnds.certificate.keystore-password=${RNDS_KEYSTORE_PASSWORD:}
rnds.certificate.keystore-type=PKCS12
rnds.certificate.truststore-path=${RNDS_TRUSTSTORE_PATH:}
rnds.certificate.truststore-password=${RNDS_TRUSTSTORE_PASSWORD:}
rnds.certificate.truststore-type=PKCS12

# Modelos de informação: ligar SOMENTE após a habilitação formal do município para o modelo
rnds.models.resultado-exame.enabled=${RNDS_RESULTADO_EXAME_ENABLED:false}
rnds.models.resultado-exame.mapping=mappings/rnds-resultado-exame-1.0.0.yaml
rnds.models.resultado-exame.ehr-path=${RNDS_RESULTADO_EXAME_PATH:/fhir/r4/Bundle}
#rnds.models.resultado-exame.bundle-type=transaction
rnds.models.sumario-alta.enabled=${RNDS_SUMARIO_ALTA_ENABLED:false}
rnds.models.sumario-alta.mapping=mappings/rnds-sumario-alta-1.0.0.yaml
rnds.models.sumario-alta.ehr-path=${RNDS_SUMARIO_ALTA_PATH:/fhir/r4/Bundle}

# FHIR Gateway municipal (leitura com client credentials, escopo system/*.read)
rnds.fhir.base-url=${FHIR_GATEWAY_URL:http://localhost:8081/fhir/r4}
rnds.fhir.auth-mode=${FHIR_AUTH_MODE:oauth2}
rnds.fhir.token-url=${FHIR_TOKEN_URL:http://localhost:8180/realms/sus-nexus/protocol/openid-connect/token}
rnds.fhir.client-id=${FHIR_CLIENT_ID:connector-rnds}
rnds.fhir.client-secret=${FHIR_CLIENT_SECRET:}
rnds.fhir.scope=system/*.read
%dev.rnds.fhir.auth-mode=none
%dev.rnds.fhir.extra-headers.X-Test-User=connector-rnds
%dev.rnds.fhir.extra-headers.X-Test-Scopes=system/*.read

rnds.submission-store.type=${RNDS_SUBMISSION_STORE:memory}
rnds.heartbeat.enabled=true
rnds.heartbeat.period-ms=60000
rnds.reconciliation.enabled=true
rnds.reconciliation.period-ms=3600000
rnds.reconciliation.window=P1D
# Ledger espelho/heartbeat/reconciliação no core (SDK CoreIntegrationMirror). O dispatcher espelha cada
# envio ao fim (com o estado de rnds_submission), por isso o espelhamento automático do runtime fica off.
connector.core.mirror.enabled=${RNDS_MIRROR_TO_CORE:true}
connector.core.mirror.pipeline-messages=false

# Gatilhos Kafka
quarkus.kafka.devservices.enabled=false
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.incoming.rnds-exam-result.connector=smallrye-kafka
mp.messaging.incoming.rnds-exam-result.topic=sus.exam.result.v1
mp.messaging.incoming.rnds-hospital-discharge.connector=smallrye-kafka
mp.messaging.incoming.rnds-hospital-discharge.topic=sus.hospital.discharge.v1
# Comandos do core (reprocessamento de submissões failed — sus.integration.reprocess.requested)
mp.messaging.incoming.rnds-integration-command.connector=smallrye-kafka
mp.messaging.incoming.rnds-integration-command.topic=sus.integration.command.v1
mp.messaging.connector.smallrye-kafka.group.id=${RNDS_CONSUMER_GROUP:connector-rnds}
mp.messaging.connector.smallrye-kafka.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.connector.smallrye-kafka.auto.offset.reset=earliest
mp.messaging.connector.smallrye-kafka.enable.auto.commit=false
mp.messaging.connector.smallrye-kafka.failure-strategy=ignore

quarkus.micrometer.export.prometheus.enabled=true
%dev.quarkus.log.category."br.gov.sus.nexus".level=DEBUG

# ------------------------------------------------------------------------------------------------
# Testes: WireMock (porta dinâmica) simula core, fhir-gateway e EHR (HTTP) e o serviço de
# autenticação (HTTPS com client-auth obrigatório); Kafka em memória.
# ------------------------------------------------------------------------------------------------
%test.quarkus.http.test-port=0
%test.mp.messaging.incoming.rnds-exam-result.connector=smallrye-in-memory
%test.mp.messaging.incoming.rnds-hospital-discharge.connector=smallrye-in-memory
%test.mp.messaging.incoming.rnds-integration-command.connector=smallrye-in-memory
%test.connector.raw-store.dir=target/test-raw-zone
%test.connector.dlq.dir=target/test-dlq
%test.connector.retry.max-attempts=3
%test.connector.retry.initial-backoff=PT0.01S
%test.connector.retry.max-backoff=PT0.05S
%test.connector.core.auth.static-token=test-token
%test.quarkus.rest-client.core.url=http://localhost:${wiremock.port:8089}
%test.rnds.auth-url=https://localhost:${wiremock.https-port:8443}/rnds-auth/api/token
%test.rnds.ehr-url=http://localhost:${wiremock.port:8089}/rnds-ehr/api
%test.rnds.requester-cpf=52998224725
%test.rnds.cnes-solicitante=2222222
%test.rnds.certificate.keystore-path=${wiremock.certs:target/test-classes/certs}/client.p12
%test.rnds.certificate.keystore-password=changeit
%test.rnds.certificate.truststore-path=${wiremock.certs:target/test-classes/certs}/client-truststore.p12
%test.rnds.certificate.truststore-password=changeit
%test.rnds.models.resultado-exame.enabled=true
%test.rnds.models.sumario-alta.enabled=false
%test.rnds.fhir.base-url=http://localhost:${wiremock.port:8089}/fhir/r4
%test.rnds.fhir.auth-mode=oauth2
%test.rnds.fhir.token-url=http://localhost:${wiremock.port:8089}/kc/token
%test.rnds.fhir.client-secret=segredo
%test.rnds.heartbeat.enabled=false
%test.rnds.reconciliation.enabled=false
%test.Retry/delay=10
%test.Retry/maxRetries=1
%test.CircuitBreaker/enabled=false
