quarkus.application.name=connector-ris
quarkus.http.port=8097
quarkus.banner.enabled=false
quarkus.log.console.filter=pii-mask
%prod.quarkus.log.console.json=true

connector.tenant-id=${TENANT_ID:ibge_3143302}
# Conector de borda: costuma rodar na rede do serviço de imagem/hospital, só sai para o barramento (mTLS).
connector.edge=${CONNECTOR_EDGE:true}
quarkus.rest-client.core.url=${CORE_URL:http://localhost:8080}
quarkus.rest-client.core.connect-timeout=5000
quarkus.rest-client.core.read-timeout=60000
# mTLS de saída (prod): keystore/truststore emitidos pela PKI do barramento, quando o core exigir.
#%prod.quarkus.rest-client.core.key-store=${CORE_MTLS_KEYSTORE}
#%prod.quarkus.rest-client.core.key-store-password=${CORE_MTLS_KEYSTORE_PASSWORD}
#%prod.quarkus.rest-client.core.trust-store=${CORE_MTLS_TRUSTSTORE}
#%prod.quarkus.rest-client.core.trust-store-password=${CORE_MTLS_TRUSTSTORE_PASSWORD}
connector.core.auth.mode=${CORE_AUTH_MODE:static}
connector.core.auth.static-token=${CORE_STATIC_TOKEN:dev-token}
quarkus.oidc-client.enabled=false
%prod.connector.core.auth.mode=oidc
%prod.quarkus.oidc-client.enabled=true
%prod.quarkus.oidc-client.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/sus-nexus
%prod.quarkus.oidc-client.client-id=${CORE_CLIENT_ID:connector-ris}
%prod.quarkus.oidc-client.credentials.secret=${CORE_CLIENT_SECRET:}
%prod.quarkus.oidc-client.grant.type=client

connector.raw-store.type=${RAW_STORE_TYPE:file}
connector.raw-store.dir=${RAW_STORE_DIR:data/raw-zone}
connector.raw-store.bucket=${RAW_STORE_BUCKET:sus-nexus-raw}
connector.raw-store.endpoint=${RAW_STORE_ENDPOINT:http://localhost:9000}
connector.ledger.type=memory
connector.dlq.dir=${DLQ_DIR:data/dlq}
connector.retry.max-attempts=5
connector.retry.initial-backoff=PT2S
connector.retry.max-backoff=PT5M

# HL7 v2.x ORM/ORU do RIS: MLLP (listener) e/ou arquivos .hl7
ris.source-version=${RIS_VERSION:RIS genérico HL7 v2.3–2.5.1 + export DICOM}
ris.charset=${RIS_CHARSET:ISO-8859-1}
ris.zone=${RIS_ZONE:America/Sao_Paulo}
ris.mllp.enabled=${RIS_MLLP_ENABLED:true}
ris.mllp.host=${RIS_MLLP_HOST:0.0.0.0}
ris.mllp.port=${RIS_MLLP_PORT:2577}
ris.mllp.receive-timeout-ms=30000
ris.file.input-dir=${RIS_INPUT_DIR:data/ris/in}
ris.file.poll-delay-ms=5000
# Metadados DICOM exportados do PACS (JSON/CSV): só referência ao estudo (dicom://<AE>/<StudyInstanceUID>)
ris.dicom.enabled=${RIS_DICOM_ENABLED:true}
ris.dicom.input-dir=${RIS_DICOM_INPUT_DIR:data/ris/dicom}
ris.dicom.poll-delay-ms=10000
ris.dicom.ae-title=${RIS_DICOM_AE_TITLE:PACS}
ris.dicom.status=${RIS_DICOM_STATUS:final}
ris.dicom.accession-field=${RIS_DICOM_ACCESSION_FIELD:AccessionNumber}
ris.dicom.csv-charset=${RIS_DICOM_CSV_CHARSET:UTF-8}
# PID-3: tipo (CX-5) usado para CNS/CPF; inferência por tamanho quando sem tipo
ris.pid.cns-identifier-type=${RIS_PID_CNS_TYPE:CNS}
ris.pid.cpf-identifier-type=${RIS_PID_CPF_TYPE:CPF}
ris.pid.infer-by-length=${RIS_PID_INFER_BY_LENGTH:true}
ris.pid.local-identifier-system=${RIS_PID_LOCAL_SYSTEM:HIS}
# Pedido (Accession Number): placer (ORC-2/OBR-2) ou filler (ORC-3/OBR-3)
ris.order.id-source=${RIS_ORDER_ID_SOURCE:placer}
ris.order.default-requesting-cnes=${RIS_DEFAULT_REQUESTING_CNES}
ris.order.default-performer-cnes=${RIS_DEFAULT_PERFORMER_CNES}
ris.order.category=imaging
# Catálogo código local (OBR-4-1) → SIGTAP; use file:/caminho.yaml para o catálogo do serviço
ris.catalog.path=${RIS_CATALOG_PATH:catalogs/ris-exam-catalog.yaml}
# Laudo crítico: flags OBX-8, campo MSH marcador e/ou OBR-5/OBR-13 contendo ris.critical.obr-value
ris.critical.flags=${RIS_CRITICAL_FLAGS:HH,LL,AA,C}
ris.critical.msh-field=${RIS_CRITICAL_MSH_FIELD}
ris.critical.msh-value=${RIS_CRITICAL_MSH_VALUE:CRITICAL}
ris.critical.obr-field=${RIS_CRITICAL_OBR_FIELD:13}
ris.critical.obr-value=${RIS_CRITICAL_OBR_VALUE:CRITICO}

quarkus.micrometer.export.prometheus.enabled=true
%dev.quarkus.log.category."br.gov.sus.nexus".level=DEBUG

%test.quarkus.http.test-port=0
%test.ris.mllp.enabled=false
%test.ris.charset=UTF-8
%test.ris.file.input-dir=target/test-input/ris
%test.ris.file.poll-delay-ms=200
%test.ris.dicom.input-dir=target/test-input/ris-dicom
%test.ris.dicom.poll-delay-ms=200
%test.ris.dicom.ae-title=PACS_FICT
%test.connector.raw-store.dir=target/test-raw-zone
%test.connector.dlq.dir=target/test-dlq
%test.connector.retry.initial-backoff=PT0.01S
%test.connector.retry.max-backoff=PT0.05S
%test.connector.core.auth.static-token=test-token
%test.quarkus.rest-client.core.url=http://localhost:${wiremock.port:8089}
%test.Retry/delay=10
%test.Retry/maxRetries=1
%test.CircuitBreaker/enabled=false
