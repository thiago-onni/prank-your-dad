# HL7 ORM^O01 do RIS → ExamOrderRegistration (POST /api/v1/exams/orders, upsert por nº do pedido).
# Modelo plano: msh.*/pid.*/pv1.*/orc.*/obr.* (Hl7Fields) + order.* derivados por RisConnector.flat:
#   order.id            ORC-2/OBR-2 (placer) ou ORC-3/OBR-3 (ris.order.id-source=filler) — é o Accession Number
#   order.exam_code     SIGTAP via OBR-4 (coding system SIGTAP) ou catálogo local→SIGTAP; senão código local
#   order.code_system   SIGTAP | LOINC (LN) | LOCAL
#   order.requesting_cnes / order.performer_cnes / order.priority / order.requested_at / order.provider_id
# citizen_ref é montado pelo conector (PID-3: CNS → CPF → identificador local).
mapping_set: ris-exam-order
version: "1.0.0"
entity_type: exam_order
lookups:
  order_status:        # ORC-5 (HL7 tabela 0038)
    SC: scheduled
    IP: performed      # exame em execução/realizado (imagem adquirida)
    A: performed
    CM: performed
    CA: cancelled
    DC: cancelled
    HD: requested
    RP: requested
  order_control:       # ORC-1 (HL7 tabela 0119) — só os que determinam status sozinhos
    CA: cancelled
    OC: cancelled
    DC: cancelled
    CR: cancelled
    DR: cancelled
  priority:            # OBR-5 / TQ-6 (HL7 tabela 0027)
    S: urgent
    A: urgent
    P: priority
    C: priority
    R: routine
    T: routine
fields:
  - { target: source.system, constant: RIS }
  - { target: source.connector, constant: connector-ris }
  - { source: order.id, target: source.source_record_id, transforms: [trim], required: true }
  - { source: msh.control_id, target: source.source_record_version, transforms: [trim, blank_to_null] }
  - { source: order.requesting_cnes, target: source.cnes, transforms: [blank_to_null] }
  - { source: orc.order_status, target: status, transforms: [trim, upper, blank_to_null, { lookup: { table: order_status, default: requested } }], depends_on: orc.order_status }
  - { source: orc.order_control, target: status_from_control, transforms: [trim, upper, blank_to_null, { lookup: { table: order_control } }], depends_on: orc.order_control }
  - { source: order.requested_at, target: requested_at, transforms: [blank_to_null], required: true }
  - { source: order.exam_code, target: exam_code, transforms: [trim], required: true }
  - { source: order.code_system, target: code_system, transforms: [trim] }
  - { source: obr.universal_text, target: exam_description, transforms: [trim, blank_to_null] }
  - { source: order.category, target: category }
  - { source: order.requesting_cnes, target: requesting_cnes, transforms: [blank_to_null] }
  - { source: order.provider_id, target: requesting_professional_id, transforms: [trim, blank_to_null] }
  - { source: orc.placer_group, target: regulation_source_record_id, transforms: [trim, blank_to_null] }
  - { source: order.priority, target: priority, transforms: [trim, upper, blank_to_null, { lookup: { table: priority, default: routine } }] }
  - { source: order.occurred_at, target: occurred_at, transforms: [blank_to_null] }
