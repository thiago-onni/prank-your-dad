                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareGap' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/protocols:
    get:
      tags: [careplan]
      summary: Protocolos de linha de cuidado (configuráveis, versionados — CUI-009)
      operationId: listProtocols
      parameters:
        - name: care_line
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [draft, in_review, approved, active, revoked] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Protocol' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [careplan]
      summary: Criar nova versão de protocolo (rascunho)
      operationId: createProtocolVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProtocolCreate' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Protocol' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/protocols/{protocolId}/versions/{version}/transition:
    post:
      tags: [careplan]
      summary: Ciclo de aprovação (draft → in_review → approved → active → revoked) com responsável e testes anexados
      operationId: transitionProtocolVersion
      parameters:
        - name: protocolId
          in: path
          required: true
          schema: { type: string }
        - name: version
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [submit, approve, activate, revoke] }
                justification: { type: string, maxLength: 500 }
                effective_from: { type: string, format: date-time }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Protocol' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/records:
    get:
      tags: [production]
      summary: Registros de produção com status de pré-auditoria (PRO-001..004)
      description: |
        Papéis: auditor (tudo), gestor, operador_integracao e admin_municipal (leitura). Dado administrativo de
        faturamento — não aparece na timeline do cidadão. CNS/CPF só mascarados.
      operationId: listProductionRecords
      parameters:
        - name: competence
          in: query
          schema: { $ref: '#/components/schemas/Competence' }
        - name: cnes
          in: query
          schema: { type: string, pattern: '^[0-9]{7}$' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ProductionKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductionRecordStatus' }
        - name: procedure_code
          in: query
          schema: { type: string }
        - name: citizen_id
          in: query
          schema: { type: string }
        - name: batch_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionRecord' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [production]
      summary: Registrar produção vinda de fonte (upsert por vínculo de origem) e pré-auditar
      description: |
        Upsert por `(tenant, source.system, source.source_record_id)`. A pré-auditoria roda na hora com o
        conjunto de regras vigente `production-validation` (platform.rule_set): sem erro → `validated`;
        com erro → `pending` + tarefa `production_issue` na fila `auditoria`. Reenvio idêntico devolve 200
        sem alteração; atualização de registro já exportado/transmitido → 409 (corrigir no sistema oficial).
        Papéis: operador_integracao (conectores), auditor.
      operationId: registerProductionRecord
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionRecordRegistration' }
      responses:
        '201':
          description: Registro criado e pré-auditado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRecord' }
        '200':
          description: Registro atualizado (ou inalterado) e pré-auditado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/records/{recordId}:
    get:
      tags: [production]
      operationId: getProductionRecord
      parameters:
        - $ref: '#/components/parameters/recordId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/records/by-source/{system}/{sourceRecordId}:
    get:
      tags: [production]
      summary: Registro de produção pelo identificador de origem (uso dos conectores)
      operationId: getProductionRecordBySource
      parameters:
        - $ref: '#/components/parameters/sourceSystem'
        - $ref: '#/components/parameters/sourceRecordId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/records/{recordId}/corrections:
    post:
      tags: [production]
      summary: Corrigir registro com justificativa e revalidar (PRO-006)
      description: |
        Somente humano com papel `auditor` (agente de IA → 403, PRO-010). Justificativa obrigatória
        (≥ 10 caracteres); alterações e justificativa vão para `production_record_history` e `audit_log`.
        Permitida em `pending`, `validated` (fora de lote aprovado) e `rejected` (reapresentação). Avisos
        podem ser dispensados (`waive_issue_ids`); erros não. Sinaliza o `ProductionPreAuditWorkflow`.
      operationId: correctProductionRecord
      parameters:
        - $ref: '#/components/parameters/recordId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionCorrection' }
      responses:
        '200':
          description: Corrigido e revalidado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionRecord' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/issues:
    get:
      tags: [production]
      summary: Pendências de pré-auditoria (fila do auditor; leitura permitida ao agente de IA)
      operationId: listProductionIssues
      parameters:
        - name: severity
          in: query
          schema: { type: string, enum: [error, warning] }
        - name: rule
          in: query
          description: rule_id (ex. `cbo_incompatible`)
          schema: { type: string }
        - name: competence
          in: query
          schema: { $ref: '#/components/schemas/Competence' }
        - name: cnes
          in: query
          schema: { type: string, pattern: '^[0-9]{7}$' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ProductionKind' }
        - name: status
          in: query
          description: padrão `open`
          schema: { type: string, enum: [open, resolved, waived] }
        - name: record_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionIssue' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/batches:
    get:
      tags: [production]
      operationId: listProductionBatches
      parameters:
        - name: competence
          in: query
          schema: { $ref: '#/components/schemas/Competence' }
        - name: cnes
          in: query
          schema: { type: string, pattern: '^[0-9]{7}$' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProductionBatchStatus' }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionBatch' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [production]
      summary: Gerar lote (rascunho) de uma competência/CNES/tipo — somente registros `validated` (PRO-005)
      description: |
        Inclui todos os registros `validated` da competência/CNES/tipo que não estão em outro lote. Sem
        registros elegíveis → 422. Papel: auditor. O lote nasce `draft` e só pode ser exportado após
        aprovação humana (`/approve`).
      operationId: createProductionBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionBatchCreate' }
      responses:
        '201':
          description: Lote gerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBatch' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/batches/{batchId}:
    get:
      tags: [production]
      operationId: getProductionBatch
      parameters:
        - $ref: '#/components/parameters/batchId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBatch' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/batches/{batchId}/approve:
    post:
      tags: [production]
      summary: Aprovação humana obrigatória do lote (PRO-010)
      description: |
        Papéis `auditor` ou `gestor`, com justificativa (≥ 10 caracteres). Agente de IA → 403 mesmo que o
        token carregue outro papel. Lote fora de `draft` → 409. Registrado em `audit_log`.
      operationId: approveProductionBatch
      parameters:
        - $ref: '#/components/parameters/batchId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionBatchApproval' }
      responses:
        '200':
          description: Aprovado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBatch' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/batches/{batchId}/export:
    post:
      tags: [production]
      summary: Exportar lote aprovado em layout configurável (arquivo + sha256); marca registros `exported`
      description: |
        Gera o arquivo no armazenamento de exportação (`ExportStorage`) e devolve a referência e o SHA-256.
        Layouts: `bpa_mag_ref_v1` (BPA-Mag simplificado — **layout de referência a homologar** com o
        validador oficial; só BPA-C/BPA-I) e `csv_ref_v1` (qualquer tipo). A transmissão oficial continua
        no sistema oficial (SIA/SIH); o barramento só marca `exported`. Papel: auditor. Agente de IA → 403.
        Lote não aprovado → 409.
      operationId: exportProductionBatch
      parameters:
        - $ref: '#/components/parameters/batchId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionBatchExportRequest' }
      responses:
        '200':
          description: Exportado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionBatch' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/outcomes:
    post:
      tags: [production]
      summary: Retorno do processamento oficial por registro ou lote (PRO-008)
      description: |
        `transmitted`/`received`/`accepted` aceitam escopo de lote (`batch_id`); `rejected` e `paid` exigem
        registro (`production_record_id` ou `record_source`). `rejected` reabre pendência com o motivo
        oficial (issue `official_rejection`) e tarefa `production_issue`; `paid` grava o valor. Idempotente
        por `(source.system, source.source_record_id, outcome, registro/lote)`. Papéis: operador_integracao,
        auditor.
      operationId: registerProductionOutcome
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductionOutcomeRegistration' }
      responses:
        '200':
          description: Aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionOutcomeResult' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/summary:
    get:
      tags: [production]
      summary: Painel de produção da competência (PRO-009)
      description: Papéis gestor, auditor, admin_municipal. Contagens por status, valores estimado/pago e perda evitável estimada.
      operationId: getProductionSummary
      parameters:
        - name: competence
          in: query
          required: true
          schema: { $ref: '#/components/schemas/Competence' }
        - name: cnes
          in: query
          schema: { type: string, pattern: '^[0-9]{7}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductionSummary' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/production/deadlines:
    get:
      tags: [production]
      summary: Competências e prazos de apresentação (PRO-007)
      description: |
        Prazo configurável em `production.production_deadline` (seed global: dia 10 do mês seguinte, 23:59
        America/Sao_Paulo; linha do tenant sobrepõe). Alertas D-5 e D-1 viram tarefas na fila `auditoria`.
      operationId: listProductionDeadlines
      parameters:
        - name: from
          in: query
          schema: { $ref: '#/components/schemas/Competence' }
        - name: to
          in: query
          schema: { $ref: '#/components/schemas/Competence' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProductionDeadline' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/rules:
    get:
      tags: [admin]
      summary: Conjuntos de regras versionados (SLA, MPI, protocolos)
      operationId: listRuleSets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RuleSet' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    cursor:
      name: cursor
      in: query
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    purpose:
      name: X-Purpose-Of-Use
      in: header
      required: true
      description: Finalidade declarada do acesso (LGPD). Avaliada pela política OPA e registrada no access_log.
      schema: { $ref: '#/components/schemas/Purpose' }
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Mesma chave + mesma requisição devolve a resposta armazenada (72 h, header Idempotent-Replayed); mesma chave + requisição diferente → 422.
      schema: { type: string, maxLength: 128 }
    correlationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema: { type: string }
    citizenId:
      name: citizenId
      in: path
      required: true
      schema: { type: string, pattern: '^cit_[0-9A-HJKMNP-TV-Z]{26}$' }
    caseId:
      name: caseId
      in: path
      required: true
      schema: { type: string }
    taskId:
      name: taskId
      in: path
      required: true
      schema: { type: string }
    requestId:
      name: requestId
      in: path
      required: true
      schema: { type: string }
    orderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    episodeId:
      name: episodeId
      in: path
      required: true
      schema: { type: string }
    carePlanId:
      name: carePlanId
      in: path
      required: true
      schema: { type: string }
    recordId:
      name: recordId
      in: path
      required: true
      schema: { type: string }
    batchId:
      name: batchId
      in: path
      required: true
      schema: { type: string }
    sourceSystem:
      name: system
      in: path
      required: true
      description: Sistema de origem (`source.system` do registro ingerido), ex. SISREG, ESUS_REGULACAO, LIS
      schema: { type: string, maxLength: 64 }
    sourceRecordId:
      name: sourceRecordId
      in: path
      required: true
      description: Identificador do registro no sistema de origem (`source.source_record_id`)
      schema: { type: string, maxLength: 256 }

  responses:
    Problem:
      description: Erro (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        correlation_id: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Purpose:
      type: string
      enum: [care_coordination, regulation, scheduling, identity_management, production_audit, public_health_surveillance, management_analytics, integration_operations, security_audit]

    Domain:
      type: string
      enum: [identity, aps, schedule, regulation, exam, hospital, careplan, task, production, communication]

    RegistrationState:
      type: string
      enum: [validated, divergent, incomplete, duplicate, pending]

    IdentifierSystem:
      type: string
      enum: [CNS, CPF, PEC, SISREG, ESUS_REGULACAO, HIS, AIH, APAC, LOCAL]

    MaskedIdentifier:
      type: object
      required: [id, system, value_masked, status, source_system]
      properties:
        id: { type: string }
        system: { $ref: '#/components/schemas/IdentifierSystem' }
        value_masked: { type: string }
        status: { type: string, enum: [active, deprecated, invalid] }
        source_system: { type: string }
        valid_from: { type: string, format: date-time }

    Provenance:
      type: object
      required: [source_system, received_at]
      properties:
        source_system: { type: string }
        source_record_id: { type: string }
        received_at: { type: string, format: date-time }
        confidence: { type: number, minimum: 0, maximum: 1 }

    CitizenSummary:
      type: object
      required: [id, display_name, registration_state, identifiers]
      properties:
        id: { type: string }
        display_name: { type: string, description: Nome social quando existir }
        birthdate: { type: string, format: date }
        sex: { type: string, enum: [female, male, unknown] }
        mother_name_masked: { type: string }
        registration_state: { $ref: '#/components/schemas/RegistrationState' }
        identifiers:
          type: array
          items: { $ref: '#/components/schemas/MaskedIdentifier' }
        health_unit_cnes: { type: string }
        team_ine: { type: string }
        microarea: { type: string }
        identity_confidence: { type: string, enum: [confirmed, probable, pending, divergent] }

    CitizenDetail:
      allOf:
        - $ref: '#/components/schemas/CitizenSummary'
        - type: object
          required: [version]
          properties:
            version: { type: integer }
            legal_name: { type: string }
            social_name: { type: string }
            mother_name: { type: string }
            address:
              type: object
              properties:
                street: { type: string }
                number: { type: string }
                complement: { type: string }
                district: { type: string }
                city_ibge: { type: string }
                postal_code: { type: string }
            contacts:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [phone, mobile, email] }
                  value_masked: { type: string }
                  preferred: { type: boolean }
            attribute_provenance:
              type: object
              additionalProperties: { $ref: '#/components/schemas/Provenance' }
            data_quality_issues:
              type: array
              items:
                type: object
                properties:
                  rule: { type: string }
                  field: { type: string }
                  message: { type: string }

    CitizenRegistration:
      type: object
      required: [source, demographics]
      properties:
        source:
          type: object
          required: [system, connector, source_record_id]
          properties:
            system: { type: string }
            connector: { type: string }
            source_record_id: { type: string }
            source_record_version: { type: string }
            cnes: { type: string }
        identifiers:
          type: array
          items:
            type: object
            required: [system, value]
            properties:
              system: { $ref: '#/components/schemas/IdentifierSystem' }
              value: { type: string }
        demographics:
          type: object
          required: [legal_name, birthdate]
          properties:
            legal_name: { type: string }
            social_name: { type: string }
            mother_name: { type: string }
            father_name: { type: string }
            birthdate: { type: string, format: date }
            sex: { type: string, enum: [female, male, unknown] }
            race_color: { type: string }
            nationality: { type: string }
            deceased: { type: boolean }
            deceased_at: { type: string, format: date }
        address:
          type: object
          properties:
            street: { type: string }
            number: { type: string }
            complement: { type: string }
            district: { type: string }
            city_ibge: { type: string }
            postal_code: { type: string }
        contacts:
          type: array
          items:
            type: object
            required: [kind, value]
            properties:
              kind: { type: string, enum: [phone, mobile, email] }
              value: { type: string }
        territory:
          type: object
          properties:
            health_unit_cnes: { type: string }
            team_ine: { type: string }
            microarea: { type: string }

    IdentityResolution:
      type: object
      required: [municipal_citizen_id, classification, method]
      properties:
        municipal_citizen_id: { type: string }
        classification: { type: string, enum: [confirmed, probable, pending, rejected, new] }
        method: { type: string }
        score: { type: number }
        rule_version: { type: string }
        merge_case_id: { type: string }
        registration_state: { $ref: '#/components/schemas/RegistrationState' }

    MergeCaseStatus:
      type: string
      enum: [open, in_review, merged, rejected, unmerged]

    MergeCase:
      type: object
      required: [id, status, candidates, opened_at]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/MergeCaseStatus' }
        reason: { type: string }
        score: { type: number }
        rule_version: { type: string }
        candidates:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/CitizenSummary' }
        evidence:
          type: array
          items:
            type: object
            properties:
              attribute: { type: string }
              comparison: { type: string }
              agreement: { type: string, enum: [agree, disagree, missing] }
              weight: { type: number }
        conflicts:
          type: array
