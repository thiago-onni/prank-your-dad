        status: { $ref: '#/components/schemas/ExamOrderStatus' }
        requested_at: { type: string, format: date-time }
        exam_code: { type: string }
        code_system: { type: string }
        exam_description: { type: string }
        category: { type: string }
        priority: { type: string }
        requesting_cnes: { type: string }
        requesting_unit_name: { type: string }
        requesting_professional_id: { type: string }
        performer_cnes: { type: string }
        regulation_request_id: { type: string }
        appointment_id: { type: string }
        scheduled_at: { type: string, format: date-time }
        performed_at: { type: string, format: date-time }
        reported_at: { type: string, format: date-time }
        care_line: { type: string }
        issues:
          type: array
          items: { type: string, enum: [not_scheduled, no_result_followup, result_pending, integration_failure, inconclusive, critical] }
        results:
          type: array
          items: { $ref: '#/components/schemas/ExamResult' }
        status_history:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/ExamOrderStatus' }
              occurred_at: { type: string, format: date-time }
              reason: { type: string }
        cycle_times:
          type: object
          description: EXA-010 (em horas)
          properties:
            request_to_schedule: { type: number }
            schedule_to_perform: { type: number }
            perform_to_report: { type: number }
            report_to_followup: { type: number }
        source_system: { type: string }
        source_record_id: { type: string }
        version: { type: integer }

    HospitalEpisodeStatus:
      type: string
      enum: [admitted, in_progress, transferred, discharged, deceased, cancelled]

    HospitalMovementRegistration:
      type: object
      required: [source, citizen_ref, hospital_cnes, episode_class, movement, occurred_at]
      properties:
        source: { $ref: '#/components/schemas/SourceRefInput' }
        citizen_ref: { $ref: '#/components/schemas/CitizenRef' }
        hospital_cnes: { type: string }
        episode_class: { type: string, enum: [inpatient, emergency, observation, day_hospital] }
        movement: { type: string, enum: [admit, transfer, bed_change, discharge, death, cancel] }
        occurred_at: { type: string, format: date-time }
        ward: { type: string }
        bed: { type: string }
        attending_professional_id: { type: string }
        admission_source: { type: string, enum: [emergency, regulation, transfer, elective, other] }
        regulation_source_record_id: { type: string }
        principal_diagnosis_cid: { type: string, description: Código CID-10; omitido quando a política classificar como highly_restricted }
        aih_number: { type: string }
        reason: { type: string, maxLength: 500 }

    DischargeRegistration:
      type: object
      required: [source, discharged_at, disposition]
      properties:
        source: { $ref: '#/components/schemas/SourceRefInput' }
        discharged_at: { type: string, format: date-time }
        disposition: { type: string, enum: [home, home_with_care, transfer, against_advice, deceased, other] }
        principal_diagnosis_cid: { type: string }
        procedures_count: { type: integer, minimum: 0 }
        followup_plan_present: { type: boolean }
        followup_due_days: { type: integer, minimum: 0 }
        care_lines: { type: array, items: { type: string } }
        summary_document_ref: { type: string, description: Referência segura ao sumário de alta na origem/object storage (HOS-009/010) }
        summary_document_sha256: { type: string }

    CounterReferralRegistration:
      type: object
      required: [source, received_at]
      properties:
        source: { $ref: '#/components/schemas/SourceRefInput' }
        received_at: { type: string, format: date-time }
        target_health_unit_cnes: { type: string }
        document_ref: { type: string }
        document_sha256: { type: string }
        recommendations_count: { type: integer, minimum: 0 }

    HospitalEpisode:
      type: object
      required: [id, citizen_id, hospital_cnes, episode_class, status, admitted_at, source_system]
      properties:
        id: { type: string }
        citizen_id: { type: string }
        hospital_cnes: { type: string }
        hospital_name: { type: string }
        episode_class: { type: string, enum: [inpatient, emergency, observation, day_hospital] }
        status: { $ref: '#/components/schemas/HospitalEpisodeStatus' }
        admitted_at: { type: string, format: date-time }
        discharged_at: { type: string, format: date-time }
        length_of_stay_days: { type: integer }
        disposition: { type: string }
        ward: { type: string }
        bed: { type: string }
        admission_source: { type: string }
        regulation_request_id: { type: string }
        principal_diagnosis_cid: { type: string, description: Presente apenas quando a política permitir }
        aih_number: { type: string }
        readmission_within_30d: { type: boolean }
        previous_episode_id: { type: string }
        reference_health_unit_cnes: { type: string }
        reference_team_ine: { type: string }
        risk_level: { type: string, enum: [low, medium, high] }
        risk_rule_version: { type: string }
        followup:
          type: object
          properties:
            status: { type: string, enum: [pending, contacted, scheduled, closed, escalated] }
            task_id: { type: string }
            due_at: { type: string, format: date-time }
            outcome: { type: string }
            contacted_at: { type: string, format: date-time }
            care_plan_id: { type: string }
        counter_referral:
          type: object
          properties:
            received_at: { type: string, format: date-time }
            has_document: { type: boolean }
            recommendations_count: { type: integer }
        has_summary_document: { type: boolean }
        movements:
          type: array
          items:
            type: object
            properties:
              movement: { type: string }
              occurred_at: { type: string, format: date-time }
              ward: { type: string }
              bed: { type: string }
        source_system: { type: string }
        source_record_id: { type: string }
        version: { type: integer }

    CareGapKind:
      type: string
      enum: [consultation_overdue, exam_overdue, vaccine_overdue, return_overdue, no_contact, lost_to_followup, post_discharge_no_contact]

    CarePlanItem:
      type: object
      required: [id, kind, title, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [consultation, exam, vaccine, return, home_visit, procedure, education, other] }
        title: { type: string }
        code: { type: string }
        code_system: { type: string }
        expected_by: { type: string, format: date-time }
        periodicity_days: { type: integer }
        status: { type: string, enum: [planned, scheduled, done, missed, cancelled] }
        performed_at: { type: string, format: date-time }
        evidence_ref: { type: string }
        overdue: { type: boolean }

    CarePlan:
      type: object
      required: [id, citizen_id, care_line, status, protocol_id, protocol_version, items, created_at]
      properties:
        id: { type: string }
        citizen_id: { type: string }
        care_line: { type: string }
        status: { type: string, enum: [active, on_hold, completed, cancelled] }
        protocol_id: { type: string }
        protocol_version: { type: string }
        health_unit_cnes: { type: string }
        team_ine: { type: string }
        responsible_professional_id: { type: string }
        origin:
          type: object
          properties:
            kind: { type: string, enum: [professional, rule, workflow, hospital_discharge] }
            id: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/CarePlanItem' }
        open_gaps: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_reason: { type: string }
        version: { type: integer }

    CarePlanCreate:
      type: object
      required: [citizen_id, protocol_id]
      properties:
        citizen_id: { type: string }
        protocol_id: { type: string }
        protocol_version: { type: string, description: Omitido = versão vigente }
        team_ine: { type: string }
        health_unit_cnes: { type: string }
        responsible_professional_id: { type: string }
        start_at: { type: string, format: date-time }
        origin:
          type: object
          properties:
            kind: { type: string, enum: [professional, rule, workflow, hospital_discharge] }
            id: { type: string }

    CareGap:
      type: object
      required: [id, citizen_id, care_line, gap_kind, status, detected_at, protocol_version]
      properties:
        id: { type: string }
        citizen_id: { type: string }
        citizen_display_name: { type: string }
        care_plan_id: { type: string }
        care_line: { type: string }
        gap_kind: { $ref: '#/components/schemas/CareGapKind' }
        status: { type: string, enum: [open, resolved] }
        expected_by: { type: string, format: date-time }
        days_overdue: { type: integer }
        protocol_id: { type: string }
        protocol_version: { type: string }
        health_unit_cnes: { type: string }
        team_ine: { type: string }
        microarea: { type: string }
        task_id: { type: string }
        detected_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution: { type: string }
        contact_valid: { type: boolean }

    ProtocolItemRule:
      type: object
      required: [kind, title, due_in_days]
      properties:
        kind: { type: string, enum: [consultation, exam, vaccine, return, home_visit, procedure, education, other] }
        title: { type: string }
        code: { type: string }
        code_system: { type: string }
        due_in_days: { type: integer, minimum: 0, description: Prazo a partir do início do plano (ou do item anterior quando periodicity) }
        periodicity_days: { type: integer }
        gap_after_days: { type: integer, description: Dias após o prazo para considerar lacuna }
        priority: { type: string, enum: [low, medium, high, urgent] }
        condition:
          type: object
          description: Expressão restrita avaliada sobre atributos do cidadão (ex. idade, sexo, risco) — sem código
          additionalProperties: true

    Protocol:
      type: object
      required: [id, care_line, name, version, status, items]
      properties:
        id: { type: string }
        care_line: { type: string }
        name: { type: string }
        version: { type: string }
        status: { type: string, enum: [draft, in_review, approved, active, revoked] }
        description: { type: string }
        eligibility:
          type: object
          additionalProperties: true
        items:
          type: array
          items: { $ref: '#/components/schemas/ProtocolItemRule' }
        lost_to_followup_days: { type: integer }
        test_cases_count: { type: integer }
        approved_by: { type: string }
        effective_from: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    ProtocolCreate:
      type: object
      required: [care_line, name, items]
      properties:
        care_line: { type: string }
        name: { type: string }
        description: { type: string }
        base_version: { type: string }
        eligibility:
          type: object
          additionalProperties: true
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProtocolItemRule' }
        lost_to_followup_days: { type: integer }
        test_cases:
          type: array
          description: Casos de teste anexados (obrigatórios para aprovação — plano 8.3)
          items:
            type: object
            additionalProperties: true

    Competence:
      type: string
      pattern: '^[0-9]{4}(0[1-9]|1[0-2])$'
      description: Competência AAAAMM

    ProductionKind:
      type: string
      enum: [bpa_c, bpa_i, apac, aih]
      description: Instrumento de registro (BPA consolidado, BPA individualizado, APAC, AIH)

    ProductionRecordStatus:
      type: string
      enum: [generated, validated, pending, exported, transmitted, received, rejected, corrected, approved, paid]

    ProductionBatchStatus:
      type: string
      enum: [draft, approved, exported, transmitted, processed]

    ExternalRef:
      type: object
      description: Referência a registro de outro domínio pelo vínculo de origem
      required: [source_record_id]
      properties:
        system: { type: string }
        source_record_id: { type: string }

    ProductionRecordRegistration:
      type: object
      required: [source, kind, competence, cnes, professional_cbo, procedure_code, quantity, attendance_date]
      properties:
        source: { $ref: '#/components/schemas/SourceRefInput' }
        kind: { $ref: '#/components/schemas/ProductionKind' }
        competence: { $ref: '#/components/schemas/Competence' }
        cnes: { type: string, pattern: '^[0-9]{7}$' }
        professional_cns:
          type: string
          writeOnly: true
          description: CNS do profissional (opcional). Persistido só como hash (HMAC por tenant), máscara e cifra (export); nunca em claro em eventos/respostas/logs.
        professional_cbo: { type: string, pattern: '^[0-9]{6}$' }
        procedure_code: { type: string, pattern: '^[0-9]{10}$', description: Código SIGTAP }
        quantity: { type: integer, minimum: 1, maximum: 999999 }
        citizen_ref:
          allOf:
            - $ref: '#/components/schemas/CitizenRef'
          description: Obrigatório para bpa_i, apac e aih (ausente → pendência citizen_unresolved). identifier_value (CNS/CPF) é validado (DV) e guardado só como hash/máscara/cifra.
        cid_code: { type: string, description: CID-10 (opcional) }
        attendance_date: { type: string, format: date }
        character_of_care: { type: string, enum: [elective, urgency, work_accident, other], description: Caráter do atendimento }
        apac_number: { type: string, maxLength: 13 }
        aih_number: { type: string, maxLength: 13 }
        encounter_ref: { $ref: '#/components/schemas/ExternalRef' }
        appointment_ref: { $ref: '#/components/schemas/ExternalRef' }
        hospital_episode_ref: { $ref: '#/components/schemas/ExternalRef' }

    ProductionIssue:
      type: object
      required: [id, production_record_id, rule_id, rule_version, severity, message, status, created_at]
      properties:
        id: { type: string }
        production_record_id: { type: string }
        rule_id: { type: string }
        rule_version: { type: string, description: 'ex.: production-validation/1' }
        severity: { type: string, enum: [error, warning] }
        field: { type: string }
        message: { type: string }
        status: { type: string, enum: [open, resolved, waived] }
        origin: { type: string, enum: [rule, workflow, official_return] }
        task_id: { type: string }
        created_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time }
        resolution_note: { type: string }
        competence: { $ref: '#/components/schemas/Competence' }
        cnes: { type: string }
        kind: { $ref: '#/components/schemas/ProductionKind' }
        procedure_code: { type: string }
        record_status: { $ref: '#/components/schemas/ProductionRecordStatus' }

    ProductionRecord:
      type: object
      required: [id, kind, competence, cnes, procedure_code, quantity, status, attendance_date, source_system, source_record_id]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ProductionKind' }
        competence: { $ref: '#/components/schemas/Competence' }
        cnes: { type: string }
        health_unit_name: { type: string }
        professional_cns_masked: { type: string }
        professional_cbo: { type: string }
        procedure_code: { type: string }
        procedure_display: { type: string }
        quantity: { type: integer }
        citizen_id: { type: string }
        citizen_identifier_masked: { type: string }
        cid_code: { type: string }
        attendance_date: { type: string, format: date }
        character_of_care: { type: string }
        apac_number: { type: string }
        aih_number: { type: string }
        appointment_id: { type: string }
        hospital_episode_id: { type: string }
        encounter_ref: { $ref: '#/components/schemas/ExternalRef' }
        status: { $ref: '#/components/schemas/ProductionRecordStatus' }
        rule_version: { type: string }
        validated_at: { type: string, format: date-time }
        unit_value: { type: number, description: Valor unitário SIGTAP (atributo `valor`) na competência }
        estimated_value: { type: number }
        paid_amount: { type: number }
        approved_quantity: { type: integer }
        outcome_reason_code: { type: string }
        outcome_reason: { type: string }
        batch_id: { type: string }
        deadline_at: { type: string, format: date-time }
        correction_count: { type: integer }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ProductionIssue' }
        history:
          type: array
          items:
            type: object
            properties:
              action: { type: string }
              from_status: { type: string }
              to_status: { type: string }
              actor_id: { type: string }
              justification: { type: string }
              rule_version: { type: string }
              occurred_at: { type: string, format: date-time }
        source_system: { type: string }
        source_record_id: { type: string }
        version: { type: integer }

    ProductionCorrection:
      type: object
      required: [justification, changes]
      properties:
        justification: { type: string, minLength: 10, maxLength: 1000 }
        changes:
          type: object
          description: Campos corrigidos (somente os informados mudam)
          properties:
            cnes: { type: string, pattern: '^[0-9]{7}$' }
            professional_cbo: { type: string, pattern: '^[0-9]{6}$' }
            professional_cns: { type: string, writeOnly: true }
            procedure_code: { type: string, pattern: '^[0-9]{10}$' }
            quantity: { type: integer, minimum: 1 }
            cid_code: { type: string }
            attendance_date: { type: string, format: date }
            competence: { $ref: '#/components/schemas/Competence' }
            character_of_care: { type: string, enum: [elective, urgency, work_accident, other] }
            apac_number: { type: string }
            aih_number: { type: string }
            citizen_ref: { $ref: '#/components/schemas/CitizenRef' }
            encounter_ref: { $ref: '#/components/schemas/ExternalRef' }
            appointment_ref: { $ref: '#/components/schemas/ExternalRef' }
            hospital_episode_ref: { $ref: '#/components/schemas/ExternalRef' }
        waive_issue_ids:
          type: array
          description: Pendências de severidade warning dispensadas com a mesma justificativa (erros não são dispensáveis)
          items: { type: string }

    ProductionBatchCreate:
      type: object
      required: [competence, cnes, kind]
      properties:
        competence: { $ref: '#/components/schemas/Competence' }
        cnes: { type: string, pattern: '^[0-9]{7}$' }
        kind: { $ref: '#/components/schemas/ProductionKind' }

    ProductionBatchApproval:
      type: object
      required: [justification]
      properties:
        justification: { type: string, minLength: 10, maxLength: 1000 }

    ProductionBatchExportRequest:
      type: object
      properties:
        layout: { type: string, enum: [bpa_mag_ref_v1, csv_ref_v1], description: 'Padrão: bpa_mag_ref_v1 para BPA-C/BPA-I; csv_ref_v1 para APAC/AIH' }

    ProductionBatch:
      type: object
      required: [id, competence, cnes, kind, status, records_count, created_at]
      properties:
        id: { type: string }
        competence: { $ref: '#/components/schemas/Competence' }
        cnes: { type: string }
        kind: { $ref: '#/components/schemas/ProductionKind' }
        status: { $ref: '#/components/schemas/ProductionBatchStatus' }
        records_count: { type: integer }
        total_quantity: { type: integer }
        estimated_value: { type: number }
        record_ids: { type: array, items: { type: string } }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        approved_by: { type: string }
        approved_at: { type: string, format: date-time }
        approval_justification: { type: string }
        export:
          type: object
          properties:
            layout: { type: string }
            file_ref: { type: string, description: Referência no armazenamento de exportação (arquivo/object storage) }
            sha256: { type: string }
            size_bytes: { type: integer }
            lines: { type: integer }
            lines_missing_identifiers: { type: integer, description: Linhas sem CNS cifrado disponível (preenchidas com zeros — revisar antes de transmitir) }
            exported_by: { type: string }
            exported_at: { type: string, format: date-time }
        protocol_number: { type: string }
        version: { type: integer }

    ProductionOutcomeRegistration:
      type: object
      required: [source, outcome, processed_at]
      description: Informe exatamente um entre production_record_id, record_source e batch_id
      properties:
        source: { $ref: '#/components/schemas/SourceRefInput' }
        outcome: { type: string, enum: [transmitted, received, accepted, rejected, paid] }
        production_record_id: { type: string }
        record_source: { $ref: '#/components/schemas/ExternalRef' }
        batch_id: { type: string }
        processed_at: { type: string, format: date-time }
        reason_code: { type: string, maxLength: 32 }
        reason: { type: string, maxLength: 500 }
        paid_amount: { type: number, minimum: 0 }
        approved_quantity: { type: integer, minimum: 0 }
        protocol_number: { type: string, maxLength: 64 }

    ProductionOutcomeResult:
      type: object
      required: [outcome, affected]
      properties:
        outcome: { type: string }
        batch_id: { type: string }
        unchanged: { type: boolean, description: Retorno já aplicado (idempotência) }
        affected:
          type: array
          items:
            type: object
            properties:
              production_record_id: { type: string }
              status: { $ref: '#/components/schemas/ProductionRecordStatus' }

    ProductionSummary:
      type: object
      required: [competence, totals]
      properties:
        competence: { $ref: '#/components/schemas/Competence' }
        cnes: { type: string }
        deadline_at: { type: string, format: date-time }
        days_to_deadline: { type: integer }
        totals:
          type: object
          properties:
            records: { type: integer }
            generated: { type: integer }
            validated: { type: integer }
            pending: { type: integer }
            exported: { type: integer }
            transmitted: { type: integer }
            received: { type: integer }
            rejected: { type: integer }
            corrected: { type: integer, description: Registros com ao menos uma correção humana }
            approved: { type: integer }
            paid: { type: integer }
        values:
          type: object
          properties:
            estimated: { type: number, description: Σ quantidade × valor SIGTAP }
            validated: { type: number }
            paid: { type: number }
            pending: { type: number }
            rejected: { type: number }
            avoidable_loss_estimated: { type: number, description: Valor de registros pendentes + rejeitados ainda não corrigidos (perda evitável se tratados no prazo) }
        issues_by_rule:
          type: array
          items:
            type: object
            properties:
              rule_id: { type: string }
              severity: { type: string }
              open: { type: integer }
        by_kind:
          type: array
          items:
            type: object
            properties:
              kind: { $ref: '#/components/schemas/ProductionKind' }
              records: { type: integer }
              estimated: { type: number }

    ProductionDeadline:
      type: object
      required: [competence, deadline_at, status]
      properties:
        competence: { $ref: '#/components/schemas/Competence' }
        deadline_at: { type: string, format: date-time }
        status: { type: string, enum: [open, closing, closed], description: closing = até 5 dias do prazo }
        days_remaining: { type: integer }
        alert_days: { type: array, items: { type: integer } }
        configured_by: { type: string, enum: [global, tenant, default] }
        pending_records: { type: integer }
        validated_records: { type: integer }
