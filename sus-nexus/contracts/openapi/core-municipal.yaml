openapi: 3.1.0
info:
  title: SUS Nexus — Core Municipal API
  version: 1.0.0
  description: |
    API interna do core municipal (Fases 1–4). Contract-first: o backend implementa e o frontend gera cliente a partir deste arquivo.
    Autenticação Bearer JWT (Keycloak). Erros em RFC 9457 (application/problem+json). Paginação por cursor.
servers:
  - url: http://localhost:8080
    description: dev local
security:
  - bearerAuth: []
tags:
  - name: citizens
  - name: mpi
  - name: timeline
  - name: appointments
  - name: tasks
  - name: integration
  - name: regulation
  - name: exams
  - name: hospital
  - name: careplan
  - name: production
  - name: terminology
  - name: reference
  - name: audit
  - name: admin

paths:
  /api/v1/citizens:
    get:
      tags: [citizens]
      summary: Busca de cidadãos
      operationId: searchCitizens
      parameters:
        - name: q
          in: query
          description: Nome, nome social ou nome da mãe (busca textual normalizada)
          schema: { type: string }
        - name: identifier
          in: query
          description: "system|value, ex.: CNS|898001234567890 ou CPF|12345678909"
          schema: { type: string }
        - name: birthdate
          in: query
          schema: { type: string, format: date }
        - name: registration_state
          in: query
          schema: { $ref: '#/components/schemas/RegistrationState' }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: Página de resultados
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CitizenSummary' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [citizens]
      summary: Registrar cidadão vindo de um sistema de origem (porta única de entrada — resolve identidade)
      operationId: registerCitizen
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CitizenRegistration' }
      responses:
        '200':
          description: Cidadão resolvido (vinculado a existente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResolution' }
        '201':
          description: Cidadão criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResolution' }
        '202':
          description: Correspondência pendente — caso de revisão aberto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityResolution' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/citizens/{citizenId}:
    get:
      tags: [citizens]
      summary: Detalhe do cidadão (dados por perfil; identificadores mascarados por padrão)
      operationId: getCitizen
      parameters:
        - $ref: '#/components/parameters/citizenId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: OK
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitizenDetail' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/citizens/{citizenId}/identifiers/{identifierId}/reveal:
    post:
      tags: [citizens]
      summary: Revelar identificador em claro (gera access_log com finalidade; exige papel)
      operationId: revealIdentifier
      parameters:
        - $ref: '#/components/parameters/citizenId'
        - name: identifierId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, justification]
              properties:
                purpose: { $ref: '#/components/schemas/Purpose' }
                justification: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [system, value]
                properties:
                  system: { type: string }
                  value: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/citizens/{citizenId}/timeline:
    get:
      tags: [timeline]
      summary: Linha do tempo do cidadão (filtrada por perfil/finalidade no servidor)
      operationId: getTimeline
      parameters:
        - $ref: '#/components/parameters/citizenId'
        - $ref: '#/components/parameters/purpose'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: domain
          in: query
          schema:
            type: array
            items: { $ref: '#/components/schemas/Domain' }
          style: form
          explode: false
        - name: cnes
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/TimelineEvent' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/citizens/{citizenId}/summary:
    get:
      tags: [timeline]
      summary: Resumo operacional (JOR-008) — sem dado clínico além do mínimo
      operationId: getCitizenSummary
      parameters:
        - $ref: '#/components/parameters/citizenId'
        - $ref: '#/components/parameters/purpose'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CitizenOperationalSummary' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/mpi/cases:
    get:
      tags: [mpi]
      summary: Fila de revisão de duplicidades/conflitos
      operationId: listMergeCases
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MergeCaseStatus' }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/MergeCase' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/mpi/cases/{caseId}:
    get:
      tags: [mpi]
      operationId: getMergeCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/mpi/cases/{caseId}/merge:
    post:
      tags: [mpi]
      summary: Fundir (MPI-007) — exige justificativa; registra auditoria e evento
      operationId: mergeCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [surviving_citizen_id, reason]
              properties:
                surviving_citizen_id: { type: string }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/mpi/cases/{caseId}/reject:
    post:
      tags: [mpi]
      summary: Rejeitar correspondência (não são a mesma pessoa)
      operationId: rejectCase
      parameters:
        - $ref: '#/components/parameters/caseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/mpi/merges/{mergeId}/unmerge:
    post:
      tags: [mpi]
      summary: Reverter fusão (MPI-007)
      operationId: unmerge
      parameters:
        - name: mergeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MergeCase' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/appointments:
    get:
      tags: [appointments]
      summary: Agenda consolidada da rede
      operationId: listAppointments
      parameters:
        - name: citizen_id
          in: query
          schema: { type: string }
        - name: cnes
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AppointmentStatus' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Appointment' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [appointments]
      summary: Registrar agendamento vindo de um sistema de origem
      operationId: registerAppointment
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentRegistration' }
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '200':
          description: Atualizado (mesmo source_record_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/appointments/{appointmentId}:
    get:
      tags: [appointments]
      operationId: getAppointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/appointments/duplicates:
    get:
      tags: [appointments]
      summary: Duplicidades detectadas (AGE-004)
      operationId: listAppointmentDuplicates
      parameters:
        - name: window_hours
          in: query
          schema: { type: integer, default: 72 }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AppointmentDuplicate' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TaskStatus' }
        - name: task_type
          in: query
          schema: { type: string }
        - name: assignee_kind
          in: query
          schema: { type: string, enum: [user, team, health_unit, queue] }
        - name: assignee_id
          in: query
          schema: { type: string }
        - name: citizen_id
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [tasks]
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/tasks/{taskId}:
    get:
      tags: [tasks]
      operationId: getTask
      parameters:
        - $ref: '#/components/parameters/taskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/tasks/{taskId}/transition:
    post:
      tags: [tasks]
      summary: Transição de estado (assign, start, complete, cancel, escalate)
      operationId: transitionTask
      parameters:
        - $ref: '#/components/parameters/taskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [assign, start, complete, cancel, escalate] }
                assignee: { $ref: '#/components/schemas/Assignee' }
                outcome: { type: string }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/connectors:
    get:
      tags: [integration]
      operationId: listConnectors
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorStatus' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/connectors/{connectorId}/heartbeat:
    post:
      tags: [integration]
      summary: Heartbeat/registro do conector (cliente técnico do conector)
      operationId: connectorHeartbeat
      parameters:
        - name: connectorId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConnectorHeartbeat' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorStatus' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/messages:
    post:
      tags: [integration]
      summary: Escrita no ledger espelho pelos conectores (upsert por id; nunca carrega o payload)
      operationId: recordIntegrationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationMessageWrite' }
      responses:
        '200':
          description: Registrado/atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationMessage' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [integration]
      operationId: listIntegrationMessages
      parameters:
        - name: connector_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/IntegrationMessageStatus' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationMessage' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/messages/{messageId}:
    get:
      tags: [integration]
      operationId: getIntegrationMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrationMessage' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/messages/{messageId}/reprocess:
    post:
      tags: [integration]
      summary: Reprocessar mensagem (idempotente; efeitos externos suprimidos — KAF-012)
      operationId: reprocessMessage
      parameters:
        - name: messageId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '202':
          description: Aceito — comando publicado em sus.integration.command.v1 (sus.integration.reprocess.requested)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message_id: { type: string }
                  event_id: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/dlq:
    get:
      tags: [integration]
      operationId: listDeadLetters
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DeadLetter' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/integration/reconciliation:
    post:
      tags: [integration]
      summary: Relatório de reconciliação enviado pelo conector (cliente técnico)
      operationId: recordReconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReconciliationEntry' }
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconciliationEntry' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [integration]
      operationId: listReconciliation
      parameters:
        - name: connector_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReconciliationEntry' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/terminology/{system}/codes:
    get:
      tags: [terminology]
      summary: Consulta de códigos (SIGTAP, CID10, CIAP2, CBO) por competência
      operationId: searchCodes
      parameters:
        - name: system
          in: path
          required: true
          schema: { type: string, enum: [SIGTAP, CID10, CIAP2, CBO] }
        - name: q
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: competence
          in: query
          description: AAAAMM
          schema: { type: string, pattern: '^[0-9]{6}$' }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Code' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/terminology/{system}/codes/upsert:
    post:
      tags: [terminology]
      summary: Upsert em lote de códigos de um sistema (SIGTAP, CID10, CBO, CIAP2) por competência
      operationId: upsertCodes
      parameters:
        - name: system
          in: path
          required: true
          schema: { type: string, enum: [SIGTAP, CID10, CBO, CIAP2] }
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/correlationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeUpsertBatch' }
      responses:
        '200':
          description: Lote aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpsertResult' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/reference/health-units/upsert:
    post:
      tags: [reference]
      summary: Upsert em lote de unidades de saúde (chave natural = cnes)
      operationId: upsertHealthUnits
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
        - $ref: '#/components/parameters/correlationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthUnitUpsertBatch' }
      responses:
        '200':
          description: Lote aplicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpsertResult' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/reference/health-units:
    get:
      tags: [reference]
      operationId: listHealthUnits
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: cnes
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/HealthUnit' }
                  next_cursor: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/audit/access:
    get:
      tags: [audit]
      summary: Trilha de acessos (DPO)
      operationId: listAccessLog
      parameters:
        - name: citizen_id
          in: query
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccessLogEntry' }
