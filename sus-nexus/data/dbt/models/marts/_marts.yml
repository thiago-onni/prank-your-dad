version: 2

# Camada gold PSEUDONIMIZADA (PLANO 10.2): citizen_key = HMAC-SHA256(municipal_citizen_id, salt) — nunca nome,
# CNS, CPF, data de nascimento ou endereço. Teste `no_pii_columns` em todos os modelos.
# Horários em America/Sao_Paulo (sem fuso). `as of` = momento da execução do dbt.

models:
  # ---------------------------------------------------------------- dimensões
  - name: dim_date
    description: Calendário diário com competência AAAAMM e prazo de envio da produção (seed_competencias).
    data_tests: [no_pii_columns]
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: competence
        data_tests: [not_null]

  - name: dim_health_unit
    description: >
      Estabelecimentos (CNES) por município. No lakehouse vem da réplica do core (reference.health_unit, catálogo
      `postgresql`); qualquer CNES observado nos eventos e ausente do core entra com `is_registered_in_core=false`.
    data_tests: [no_pii_columns]
    meta: { owner: core-municipal / reference }
    columns:
      - name: health_unit_key
        description: "Chave `<tenant_id>:<cnes>`."
        data_tests: [unique, not_null]
      - name: health_unit_cnes
        data_tests: [not_null]
      - name: unit_role
        data_tests:
          - accepted_values:
              arguments:
                values: [aps, hospital, outro]

  - name: dim_territory
    description: Território de saúde (unidade × equipe INE × microárea), derivado de cadastro, lacunas e planos.
    data_tests: [no_pii_columns]
    columns:
      - name: territory_key
        description: "Chave `<tenant_id>:<cnes>:<ine>:<microárea>` ('-' quando ausente)."
        data_tests: [unique, not_null]
      - name: territory_level
        data_tests:
          - accepted_values:
              arguments:
                values: [microarea, equipe, unidade, municipio]

  # ---------------------------------------------------------------- fatos
  - name: fct_appointments
    description: >
      Agendamentos (AGE-010) — 1 linha por agendamento (APS e rede), excluídas duplicidades detectadas.
      Desfecho: attended (comparecimento), no_show (falta), cancelled, pending (futuro/sem desfecho).
      Reaproveitamento: vaga cancelada ocupada por outro agendamento (mesmo CNES, serviço e horário) criado após o
      cancelamento.
    data_tests: [no_pii_columns]
    meta: { owner: Coordenação da APS / Central de agendamento, fonte: "sus.aps.appointment.v1, sus.schedule.appointment.v1" }
    columns:
      - name: appointment_id
        data_tests: [unique, not_null]
      - name: tenant_id
        data_tests: [not_null]
      - name: citizen_key
        description: HMAC-SHA256 do municipal_citizen_id (pseudônimo estável).
      - name: health_unit_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_health_unit')
                field: health_unit_key
      - name: scheduled_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: outcome
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [attended, no_show, cancelled, pending]
      - name: agenda_channel
        data_tests:
          - accepted_values:
              arguments:
                values: [aps, schedule]
      - name: is_slot_reused
        description: Verdadeiro para agendamento cancelado cuja vaga foi reocupada.

  - name: fct_regulation_requests
    description: >
      Solicitações regulatórias (PLANO 4.9) — 1 linha por solicitação: espera até agendamento/realização, SLA
      (sla_due_at do pedido; violado se agendamento/decisão após o prazo ou se em aberto além do prazo),
      devoluções, prioridade e desfecho. Decisão regulatória vem sempre do sistema oficial (REG-009).
    data_tests: [no_pii_columns]
    meta: { owner: Complexo regulador, fonte: "sus.regulation.request.v1, sus.regulation.status.v1" }
    columns:
      - name: regulation_request_id
        data_tests: [unique, not_null]
      - name: requesting_unit_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_health_unit')
                field: health_unit_key
      - name: priority
        data_tests:
          - accepted_values:
              arguments:
                values: [elective, priority, urgent, emergency]
      - name: status
        data_tests: [not_null]
      - name: wait_days_to_schedule
        description: Dias corridos da solicitação ao agendamento (status scheduled).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: returned_count
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_exam_cycle
    description: >
      Ciclo do exame (EXA-010) — pedido → agendamento → realização → laudo → retorno. Retorno = consulta realizada
      do mesmo cidadão vinculada ao pedido (exam_order_id) ou consulta de retorno em até 60 dias após o laudo.
    data_tests: [no_pii_columns]
    meta: { owner: Coordenação de apoio diagnóstico, fonte: "sus.exam.order.v1, sus.exam.result.v1, agendamentos" }
    columns:
      - name: exam_order_id
        data_tests: [unique, not_null]
      - name: cycle_stage
        data_tests:
          - accepted_values:
              arguments:
                values: [solicitado, autorizado, agendado, realizado, laudo, retorno, encerrado_sem_realizacao]
      - name: requesting_unit_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_health_unit')
                field: health_unit_key
      - name: days_request_to_result
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_hospital_episodes
    description: >
      Episódios hospitalares — internações, permanência (LOS), reinternação em 30 dias (próxima internação do
      mesmo cidadão até 30 dias após a alta), tempo até o primeiro contato da APS após a alta (consulta realizada
      ou tarefa pós-alta concluída) e tempo até a criação da tarefa pós-alta (SLO < 15 min, PLANO 9.3).
    data_tests: [no_pii_columns]
    meta: { owner: Diretoria hospitalar / Coordenação da APS, fonte: "sus.hospital.adt.v1, sus.hospital.discharge.v1, tarefas, agendamentos" }
    columns:
      - name: hospital_episode_id
        data_tests: [unique, not_null]
      - name: hospital_unit_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_health_unit')
                field: health_unit_key
      - name: episode_class
        data_tests:
          - accepted_values:
              arguments:
                values: [inpatient, emergency, observation, day_hospital]
      - name: length_of_stay_days
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: hours_to_first_contact
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_tasks
    description: >
      Tarefas — criação, atribuição, conclusão e SLA (due_at). Origem: agent/workflow/rule/connector = automação;
      user = humano. Base dos indicadores de automação e de autonomia graduada dos agentes (PLANO 9.3).
    data_tests: [no_pii_columns]
    meta: { owner: Gestão operacional / Escritório de IA, fonte: sus.task.v1 }
    columns:
      - name: task_id
        data_tests: [unique, not_null]
      - name: origin_group
        data_tests:
          - accepted_values:
              arguments:
                values: [automacao, humano]
      - name: task_type
        data_tests:
          - accepted_values:
              arguments:
                values: [mpi_review, active_search, no_show_recovery, exam_not_scheduled, exam_result_followup, post_discharge_followup, regulation_pending_document, production_issue, integration_error, care_gap, generic]
      - name: created_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_care_gaps
    description: Lacunas de cuidado abertas/resolvidas por linha de cuidado e território (CUI-002/003).
    data_tests: [no_pii_columns]
    meta: { owner: Coordenação de linhas de cuidado, fonte: sus.caregap.v1 }
    columns:
      - name: care_gap_id
        data_tests: [unique, not_null]
      - name: territory_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_territory')
                field: territory_key
      - name: gap_kind
        data_tests:
          - accepted_values:
              arguments:
                values: [consultation_overdue, exam_overdue, vaccine_overdue, return_overdue, no_contact, lost_to_followup, post_discharge_no_contact]

  - name: fct_production
    description: >
      Produção por registro (PRO-001…010; contracts/events/production): validação (pendências por regra,
      severidade), correções, lote (submission) e retorno oficial (received → accepted/rejected → paid, com
      reason_code/reason, approved_quantity, paid_amount). Tolerante: materializa vazio (mesmo schema) enquanto
      bronze.events_production não existir.
    data_tests: [no_pii_columns]
    meta: { owner: Controle e avaliação, fonte: "sus.production.record|validation|submission|outcome.v1" }
    columns:
      - name: production_record_id
        data_tests: [unique]
      - name: outcome
        description: Último retorno oficial do registro (ordenado por processed_at).
        data_tests:
          - accepted_values:
              arguments:
                values: [received, accepted, rejected, paid]
      - name: production_kind
        description: Instrumento (`kind` no contrato).
        data_tests:
          - accepted_values:
              arguments:
                values: [bpa_c, bpa_i, apac, aih]
      - name: batch_status
        data_tests:
          - accepted_values:
              arguments:
                values: [draft, approved, exported, transmitted, processed]
