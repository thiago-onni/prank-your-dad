          max_value: 1
- name: agg_indicadores_mensais
  description: Indicadores mensais em formato longo (unidade e município) com meta, supressão (n<5) e situação frente à meta.
    Fonte da Sala de Situação; dicionário em data/INDICADORES.md.
  data_tests:
  - no_pii_columns
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - indicator_code
        - tenant_id
        - month_start
        - aggregation_level
        - health_unit_key
  columns:
  - name: indicator_code
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('seed_metas_indicadores')
          field: indicator_code
  - name: aggregation_level
    data_tests:
    - accepted_values:
        arguments:
          values:
          - unidade
          - municipio
  - name: numerator
    data_tests:
    - small_cells_suppressed
  - name: denominator
    data_tests:
    - small_cells_suppressed
  - name: indicator_value
    description: Valor (proporção 0–1, dias ou horas — ver indicator_unit). Nulo se denominador < 5.
  - name: is_suppressed
    data_tests:
    - not_null
