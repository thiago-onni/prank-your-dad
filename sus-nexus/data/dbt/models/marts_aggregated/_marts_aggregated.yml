        combination_of_columns:
        - tenant_id
        - month_start
        - territory_key
        - care_line
  columns:
  - name: n_detected
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_resolved
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_open
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_with_task
    description: Contagem (nula se 0 < n < 5).
    data_tests:
