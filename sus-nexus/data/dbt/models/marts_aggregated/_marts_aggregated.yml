    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_with_issue
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_accepted
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_rejected
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_paid
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_pending
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: n_corrected
    description: Contagem (nula se 0 < n < 5).
    data_tests:
    - small_cells_suppressed
  - name: rejection_rate
    description: Registros glosados / registros com desfecho.
    meta:
      indicador:
        codigo: PRO_GLOSA
        formula: n_rejected / n_with_outcome (retorno final accepted/rejected/paid)
