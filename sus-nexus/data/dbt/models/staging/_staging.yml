# Gerado inicialmente por script; mantenha à mão.
version: 2
models:
- name: stg_identity__citizen
  description: Eventos de cidadão (estado cadastral e território), sem PII. Envelope tipado, replay=false, dedupe por event_id
    (staging — uso interno do pipeline).
  columns:
  - name: event_id
    description: ULID do evento (evt_). Único após dedupe de reentregas.
    data_tests:
    - unique
    - not_null
  - name: event_action
    description: Ação (último segmento de event_type).
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - created
          - linked
          - updated
          - registration_state_changed
  - name: tenant_id
    description: Município (ibge_<7 dígitos>).
    data_tests:
    - not_null
  - name: occurred_at
    description: Quando o fato aconteceu (horário local America/Sao_Paulo, sem fuso).
    data_tests:
    - not_null
  - name: municipal_citizen_id
    description: 'Identificador interno do cidadão (cit_). Uso interno: nunca exposto em marts pseudonimizados.'
    data_tests:
    - not_null
