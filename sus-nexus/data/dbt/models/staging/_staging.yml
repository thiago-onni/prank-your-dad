- name: stg_production__events
  description: 'Eventos de produção (contracts/events/production: record, validation, submission, outcome) tipados,
    replay=false, dedupe por event_id. Não projeta identificadores de cidadão/profissional. Leitura tolerante: vazio
    com schema se a fonte não existir.'
  columns:
  - name: event_id
    data_tests:
    - unique
  - name: production_entity
    description: record | validation | submission | outcome
    data_tests:
    - accepted_values:
        arguments:
          values: [record, validation, submission, outcome]
  - name: event_action
    data_tests:
    - accepted_values:
        arguments:
          values: [created, validated, pending, corrected, issue_found, issue_resolved, batch_generated, batch_approved,
            exported, transmitted, received, accepted, rejected, paid]
  - name: production_kind
    description: Instrumento (`kind` no contrato).
    data_tests:
    - accepted_values:
        arguments:
          values: [bpa_c, bpa_i, apac, aih]
  - name: severity
    data_tests:
    - accepted_values:
        arguments:
          values: [error, warning]
