# Projeto dbt da camada analítica do SUS Nexus (Fase 4 — PLANO_IMPLEMENTACAO.md seção 10, ADR-015).
# bronze (Iceberg, Kafka Connect) → staging → intermediate (silver) → marts / marts_aggregated (gold).
name: sus_nexus
version: "0.1.0"
config-version: 2
profile: sus_nexus          # Trino (lakehouse). CI/local sem infraestrutura: --profile duckdb

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: target
clean-targets: [target, dbt_packages, logs]

vars:
  # Salt (chave) do HMAC que gera citizen_key. Em hml/prod vem do OpenBao (DBT_CITIZEN_KEY_SALT);
  # o valor padrão é só para dev/CI. Trocar o salt muda todas as chaves (sem vínculo com marts antigos).
  citizen_key_salt: "{{ env_var('DBT_CITIZEN_KEY_SALT', 'dev-only-not-a-secret') }}"
  # Supressão de células pequenas nos marts agregados (n < limiar → nulo).
  small_cell_threshold: 5
  # Fuso para datas de negócio (competência, mês de referência).
  business_timezone: America/Sao_Paulo
  # Calendário (dim_date).
  dim_date_start: "2024-01-01"
  dim_date_end: "2028-12-31"
  # Janela (dias) para reinternação e contato pós-alta.
  readmission_window_days: 30
  post_discharge_contact_window_days: 7
  # Janela (dias) para considerar retorno após resultado de exame.
  exam_return_window_days: 60

models:
  sus_nexus:
    +persist_docs: { relation: true, columns: true }
    staging:
      +schema: staging
      +materialized: view          # Iceberg views (catálogo JDBC schema V1); sem materialized views no JDBC
      +persist_docs: { relation: true, columns: false }
      +tags: [staging]
    intermediate:
      +schema: intermediate
      +materialized: table
      +tags: [silver]
    marts:
      +schema: marts
      +materialized: table
      +tags: [gold, pseudonymized]
    marts_aggregated:
      +schema: marts_aggregated
      +materialized: table
      +tags: [gold, aggregated]
    marts_identified:
      +schema: marts_identified
      +materialized: table
      +tags: [gold, identified]

seeds:
  sus_nexus:
    +schema: reference
    +tags: [seed]

tests:
  sus_nexus:
    +severity: error

flags:
  require_certificate_validation: true
  send_anonymous_usage_stats: false
