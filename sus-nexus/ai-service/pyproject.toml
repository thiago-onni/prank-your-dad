[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sus-nexus-ai-service"
version = "0.1.0"
description = "SUS Nexus — serviço de agentes de IA (FastAPI + LangGraph + LiteLLM)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.2.50",
  "litellm>=1.50",
  "httpx>=0.27",
  "structlog>=24.1",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.8",
  "python-ulid>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
]
observability = [
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "langfuse>=2.40",
]
kafka = ["aiokafka>=0.11"]
postgres-checkpoint = ["langgraph-checkpoint-postgres>=2.0"]

[project.scripts]
sus-nexus-ai = "sus_nexus_ai.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["sus_nexus_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["sus_nexus_ai", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pydantic.warnings.PydanticDeprecatedSince20"]
env = []
