# Values do chart grafana/loki (modo SimpleScalable, storage MinIO/S3). Logs chegam via OTLP do collector
# já sem PII. Retenção: 30 dias (audit vai para o Kafka sus.audit.v1 + WORM, não para o Loki).
fullnameOverride: loki
deploymentMode: SimpleScalable
loki:
  auth_enabled: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: s3
    bucketNames:
      chunks: loki-chunks
      ruler: loki-ruler
      admin: loki-admin
    s3:
      endpoint: https://minio.data.svc.cluster.local
      region: sa-east-1
      s3ForcePathStyle: true
      insecure: false
      accessKeyId: ${S3_ACCESS_KEY_ID}
      secretAccessKey: ${S3_SECRET_ACCESS_KEY}
      http_config:
        ca_file: /etc/ssl/certs/minio-ca.crt
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
    volume_enabled: true
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    max_label_names_per_series: 20
    otlp_config:
      resource_attributes:
        attributes_config:
          - action: index_label
            attributes: [service.name, deployment.environment, k8s.namespace.name, k8s.deployment.name, tenant.id]
  compactor:
    retention_enabled: true
    delete_request_store: s3
  ruler:
    enable_api: true
    storage:
      type: s3
  analytics:
    reporting_enabled: false
  commonConfig:
    replication_factor: 2
write:
  replicas: 3
  persistence:
    storageClass: fast-nvme
    size: 50Gi
  extraArgs: [-config.expand-env=true]
  extraEnvFrom: [{ secretRef: { name: loki-s3-credentials } }]
  extraVolumes: [{ name: minio-ca, secret: { secretName: minio-ca } }]
  extraVolumeMounts: [{ name: minio-ca, mountPath: /etc/ssl/certs/minio-ca.crt, subPath: ca.crt }]
read:
  replicas: 2
  extraArgs: [-config.expand-env=true]
  extraEnvFrom: [{ secretRef: { name: loki-s3-credentials } }]
  extraVolumes: [{ name: minio-ca, secret: { secretName: minio-ca } }]
  extraVolumeMounts: [{ name: minio-ca, mountPath: /etc/ssl/certs/minio-ca.crt, subPath: ca.crt }]
backend:
  replicas: 2
  persistence:
    storageClass: standard
    size: 20Gi
  extraArgs: [-config.expand-env=true]
  extraEnvFrom: [{ secretRef: { name: loki-s3-credentials } }]
  extraVolumes: [{ name: minio-ca, secret: { secretName: minio-ca } }]
  extraVolumeMounts: [{ name: minio-ca, mountPath: /etc/ssl/certs/minio-ca.crt, subPath: ca.crt }]
gateway:
  enabled: true
  replicas: 2
chunksCache:
  enabled: true
  allocatedMemory: 2048
resultsCache:
  enabled: true
minio:
  enabled: false        # usa o MinIO Tenant da plataforma (namespace data)
monitoring:
  serviceMonitor:
    enabled: true
    labels: { release: kube-prometheus-stack }
  dashboards:
    enabled: true
  rules:
    enabled: true
    labels: { release: kube-prometheus-stack }
test:
  enabled: false
lokiCanary:
  enabled: false
