# Configuração do OTel Collector em cluster (usada por otel-collector-values.yaml → chart
# opentelemetry-collector). Mantida em sincronia com platform/compose/otel/otel-collector.yaml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["0.0.0.0:8888"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  k8sattributes:
    auth_type: serviceAccount
    passthrough: false
    extract:
      metadata: [k8s.namespace.name, k8s.pod.name, k8s.deployment.name, k8s.node.name]
      labels:
        - tag_name: app
          key: app.kubernetes.io/name
          from: pod
        - tag_name: component
          key: app.kubernetes.io/component
          from: pod
    pod_association:
      - sources: [{ from: resource_attribute, name: k8s.pod.ip }]
      - sources: [{ from: resource_attribute, name: k8s.pod.uid }]
      - sources: [{ from: connection }]

  # --- Remoção de PII (CPF / CNS / e-mail) em atributos e corpo de log — LGPD, CONVENTIONS "Segurança" ---
  transform/pii:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***.***.***-**")
          - replace_pattern(body, "\\b[1-2789]\\d{14}\\b", "***************")
          - replace_pattern(body, "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<email>")
          - replace_all_patterns(attributes, "value", "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***.***.***-**")
          - replace_all_patterns(attributes, "value", "\\b[1-2789]\\d{14}\\b", "***************")
    trace_statements:
      - context: span
        statements:
          - replace_all_patterns(attributes, "value", "\\b\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}\\b", "***.***.***-**")
          - replace_all_patterns(attributes, "value", "\\b[1-2789]\\d{14}\\b", "***************")
          - replace_pattern(name, "\\d{3}\\.?\\d{3}\\.?\\d{3}-?\\d{2}", "{cpf}")
          - replace_pattern(attributes["url.full"], "(cpf|cns)=[^&]+", "$$1=***")
          - replace_pattern(attributes["url.query"], "(cpf|cns)=[^&]+", "$$1=***")
          - replace_pattern(attributes["url.path"], "/identifiers/(CPF|CNS)/[0-9.-]+", "/identifiers/$$1/***")

  attributes/strip:
    actions:
      - { key: cpf, action: delete }
      - { key: cns, action: delete }
      - { key: citizen.cpf, action: delete }
      - { key: citizen.cns, action: delete }
      - { key: citizen.name, action: delete }
      - { key: patient.name, action: delete }
      - { key: enduser.id, action: hash }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: db.query.text, action: hash }
      - { key: db.statement, action: hash }

  # Tail sampling: mantém 100% dos erros/lentos e 10% do resto
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - { name: errors, type: status_code, status_code: { status_codes: [ERROR] } }
      - { name: slow, type: latency, latency: { threshold_ms: 2000 } }
      - { name: baseline, type: probabilistic, probabilistic: { sampling_percentage: 10 } }

  resource:
    attributes:
      - { key: cluster, value: "${env:CLUSTER_NAME}", action: upsert }

  batch:
    timeout: 5s
    send_batch_size: 2048

exporters:
  prometheusremotewrite:
    endpoint: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki-gateway.observability.svc.cluster.local/otlp
    tls:
      insecure: true
  otlp/tempo:
    endpoint: tempo-distributor.observability.svc.cluster.local:4317
    tls:
      insecure: true

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: normal
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, attributes/strip, transform/pii, tail_sampling, resource, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, k8sattributes, resource, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, attributes/strip, transform/pii, resource, batch]
      exporters: [otlphttp/loki]
