apiVersion: v1
kind: ConfigMap
metadata:
  name: sus-dashboard-connectors
  namespace: observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: sus-nexus
  annotations:
    grafana_folder: SUS Nexus
data:
  sus-connectors.json: |-
    {
      "uid": "sus-connectors",
      "title": "SUS Nexus · Conectores",
      "description": "Recebido/processado/falho, latência, reconciliação e status por conector.",
      "tags": [
        "sus-nexus",
        "connectors",
        "integration"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Ambiente",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(up, environment)",
            "refresh": 1,
            "includeAll": true,
            "multi": false,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          },
          {
            "name": "tenant",
            "label": "Município",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(sus_tenant_info, tenant_id)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          },
          {
            "name": "connector",
            "label": "Conector",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(sus_connector_messages_received_total, connector_id)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "panels": [
        {
          "id": 40,
          "title": "Visão geral",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 44,
          "title": "Recebidas / processadas / falhas (5m)",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 16,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector_id) (rate(sus_connector_messages_received_total{connector_id=~\"$connector\"}[5m]))",
              "legendFormat": "recebidas {{connector_id}}",
              "refId": "P"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector_id) (rate(sus_connector_messages_processed_total{connector_id=~\"$connector\"}[5m]))",
              "legendFormat": "processadas {{connector_id}}",
              "refId": "Q"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (connector_id) (rate(sus_connector_messages_failed_total{connector_id=~\"$connector\"}[5m]))",
              "legendFormat": "falhas {{connector_id}}",
              "refId": "R"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 46,
          "title": "Taxa de falha (5m)",
          "type": "gauge",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 16,
            "y": 1,
            "w": 8,
            "h": 9
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(sus_connector_messages_failed_total{connector_id=~\"$connector\"}[5m])) / clamp_min(sum(rate(sus_connector_messages_received_total{connector_id=~\"$connector\"}[5m])), 1e-9)",
              "legendFormat": "falhas",
              "refId": "T"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 48,
          "title": "Latência fonte → barramento (p95)",
          "type": "timeseries",
          "description": "",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 10,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (le, connector_id) (rate(sus_connector_processing_latency_seconds_bucket{connector_id=~\"$connector\"}[5m])))",
              "legendFormat": "{{connector_id}}",
              "refId": "V"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
