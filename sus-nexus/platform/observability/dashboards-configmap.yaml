      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "environment",
            "label": "Ambiente",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(up, environment)",
            "refresh": 1,
            "includeAll": true,
            "multi": false,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          },
          {
            "name": "tenant",
            "label": "Município",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(sus_tenant_info, tenant_id)",
            "refresh": 1,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            },
            "sort": 1
          }
        ]
