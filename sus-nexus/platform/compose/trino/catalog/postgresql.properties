# Réplica de leitura do core (em dev: o próprio Postgres local). Usuário analytics_ro: somente leitura
# (default_transaction_read_only), BYPASSRLS para leitura multi-município — o recorte por município é feito
# pelas regras de linha do Trino (rules.json). Só o usuário de pipeline (dbt) e admin enxergam este catálogo.
connector.name=postgresql
connection-url=jdbc:postgresql://postgres:5432/sus_nexus_core?readOnly=true&ApplicationName=trino-analytics
connection-user=${ENV:CORE_REPLICA_USER}
connection-password=${ENV:CORE_REPLICA_PASSWORD}
postgresql.include-system-tables=false
