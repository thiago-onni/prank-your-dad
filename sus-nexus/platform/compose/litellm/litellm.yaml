# LiteLLM proxy (local). O ai-service fala apenas com o LiteLLM (ADR: agnosticismo de modelo).
model_list:
  - model_name: sus-default
    litellm_params:
      model: ollama/llama3.1
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: sus-fast
    litellm_params:
      model: ollama/llama3.1
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: sus-embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_BASE_URL
  # Exemplos de provedores externos (chaves via .env; NUNCA envie dado identificado para fora sem
  # autorização do DPO — ver PLANO 9.2)
  - model_name: sus-reasoning
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  drop_params: true
  set_verbose: false
  json_logs: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  redact_user_api_key_info: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false

environment_variables:
  LANGFUSE_HOST: http://langfuse:3000
