apiVersion: 1
providers:
  - name: sus-nexus
    orgId: 1
    folder: SUS Nexus
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Montado de platform/observability/dashboards (mesmos JSON usados no cluster)
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
