# EXEMPLO de SecretStore por namespace (quando uma equipe precisa de um caminho/role próprio no OpenBao
# em vez do ClusterSecretStore "openbao"). Copie para o chart/namespace e ajuste role/path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-connectors
  namespace: connectors
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: openbao-connectors
  namespace: connectors
spec:
  provider:
    vault:
      server: https://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: ConfigMap
        name: sus-nexus-ca-bundle
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: connectors-reader          # política: read secret/data/<env>/connector-*/*
          serviceAccountRef:
            name: eso-connectors
---
# Credenciais do sistema de origem do conector PEC (JDBC do e-SUS) — consumidas pelo chart do conector via
# externalSecret.dataFrom (todas as chaves viram variáveis de ambiente).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: connector-pec-source
  namespace: connectors
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: openbao-connectors
    kind: SecretStore
  target:
    name: connector-pec-source
  dataFrom:
    - extract:
        key: prod/connector-pec/source     # { PEC_JDBC_URL, PEC_JDBC_USER, PEC_JDBC_PASSWORD }
