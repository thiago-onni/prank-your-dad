# External Secrets Operator → OpenBao (KV v2 em `secret/`, autenticação Kubernetes).
# Layout de chaves: secret/<env>/<componente>/<grupo> (ex.: secret/prod/core-municipal/db).
# Políticas do OpenBao concedem a cada SA do ESO leitura apenas do seu <env>.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-openbao
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    # Somente namespaces do SUS Nexus podem usar este store
    - namespaceSelector:
        matchLabels:
          sus-nexus.gov.br/secrets: openbao
  provider:
    vault:
      server: https://openbao.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: sus-nexus-root-ca
        key: ca.crt
        namespace: cert-manager
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets-openbao
            namespace: external-secrets
---
# Store secundário para engine de banco dinâmico (credenciais efêmeras de leitura para BI/Metabase)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao-database
spec:
  conditions:
    - namespaceSelector:
        matchLabels:
          sus-nexus.gov.br/secrets: openbao
  provider:
    vault:
      server: https://openbao.openbao.svc.cluster.local:8200
      path: database
      version: v1
      caProvider:
        type: Secret
        name: sus-nexus-root-ca
        key: ca.crt
        namespace: cert-manager
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets-openbao
            namespace: external-secrets
---
# Segredo de rotação: ESO renova credenciais dinâmicas de banco a cada 1h (exemplo para Metabase)
apiVersion: external-secrets.io/v1beta1
kind: ClusterExternalSecret
metadata:
  name: route53-credentials
spec:
  externalSecretName: route53-credentials
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: cert-manager
  refreshTime: 1h
  externalSecretSpec:
    refreshInterval: 1h
    secretStoreRef:
      name: openbao
      kind: ClusterSecretStore
    target:
      name: route53-credentials
    data:
      - secretKey: access-key-id
        remoteRef: { key: shared/dns/route53, property: access_key_id }
      - secretKey: secret-access-key
        remoteRef: { key: shared/dns/route53, property: secret_access_key }
