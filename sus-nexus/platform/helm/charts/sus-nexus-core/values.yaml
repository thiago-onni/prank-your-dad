# Valores padrão — sus-nexus-core (Quarkus, porta 8080).
# Os charts de componente compartilham a mesma estrutura; diferenças ficam marcadas com "# <<".

global:
  environment: dev
  imageRegistry: ""           # sobrescreve image.registry quando definido (ex.: harbor.sus.local/sus-nexus)
  imagePullSecrets: []
  multiZone: false            # topologySpreadConstraints por zona (prod)
  domain: sus-nexus.local
  keycloakUrl: https://auth.sus-nexus.local
  keycloakRealm: sus-nexus
  namespaces:
    core: core
    fhir: fhir
    connectors: connectors
    ai: ai
    web: web
    data: data
    security: security
    workflows: workflows
    observability: observability
    gateway: gateway

nameOverride: ""
fullnameOverride: "core-municipal"
namespaceOverride: ""
component: core-municipal     # <<
tier: backend

image:
  registry: ghcr.io
  repository: sus-nexus/core-municipal   # <<
  tag: ""                                # default: Chart.appVersion
  digest: ""                             # preferir digest em prod (imagem assinada por cosign)
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 2
revisionHistoryLimit: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
terminationGracePeriodSeconds: 30
priorityClassName: ""
containerPort: 8080           # <<
extraPorts: []
command: []
args: []

service:
  type: ClusterIP
  port: 8080
  annotations: {}

probes:                        # << Quarkus: /q/health/*
  startup:
    enabled: true
    path: /q/health/started
    periodSeconds: 5
    failureThreshold: 60
    timeoutSeconds: 3
  liveness:
    path: /q/health/live
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

lifecycle:
  preStop:
    exec:
      command: ["sh", "-c", "sleep 5"]

resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    cpu: "2"
    memory: 1536Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185               # << usuário da imagem ubi/quarkus; web usa 1000, ai 10001
  runAsGroup: 185
  fsGroup: 185
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

tmpSizeLimit: 512Mi
writableDirs: []               # ex.: [{name: cache, mountPath: /app/.next/cache, sizeLimit: 256Mi}]
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []

podLabels: {}
podAnnotations:
  prometheus.io/scrape: "false"   # scrape via ServiceMonitor
extraLabels: {}
deploymentAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

serviceAccount:
  create: true
  automount: false
  name: ""
  annotations: {}

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilizationSeconds: 300
  customMetrics: []

pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
  protocol: grpc

# Variáveis de ambiente não sensíveis (ConfigMap, envFrom). Suporta `tpl`.
config:                        # <<
  QUARKUS_PROFILE: prod
  QUARKUS_HTTP_PORT: "8080"
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://core-db-rw.data.svc.cluster.local:5432/sus_nexus_core
  QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "20"
  QUARKUS_FLYWAY_MIGRATE_AT_START: "false"
  QUARKUS_OIDC_AUTH_SERVER_URL: "{{ .Values.global.keycloakUrl }}/realms/{{ .Values.global.keycloakRealm }}"
  QUARKUS_OIDC_CLIENT_ID: core-municipal
  QUARKUS_OIDC_TOKEN_AUDIENCE: core-municipal
  KAFKA_BOOTSTRAP_SERVERS: sus-kafka-kafka-bootstrap.data.svc.cluster.local:9093
  KAFKA_SECURITY_PROTOCOL: SSL
  APICURIO_REGISTRY_URL: http://apicurio.data.svc.cluster.local:8080/apis/registry/v3
  OPA_URL: http://opa.security.svc.cluster.local:8181
  OPA_POLICY_PATH: /v1/data/sus/authz/allow
  TEMPORAL_ADDRESS: temporal-frontend.workflows.svc.cluster.local:7233
  TEMPORAL_NAMESPACE: sus-nexus
  QUARKUS_REDIS_HOSTS: redis://redis.data.svc.cluster.local:6379
  S3_ENDPOINT: https://minio.data.svc.cluster.local
  S3_BUCKET_RAW_ZONE: raw-zone
  S3_BUCKET_DOCUMENTS: documents
  QUARKUS_LOG_CONSOLE_JSON: "true"
  QUARKUS_LOG_LEVEL: INFO
  QUARKUS_OTEL_SDK_DISABLED: "false"
  QUARKUS_OTEL_TRACES_SAMPLER: parentbased_traceidratio
  QUARKUS_OTEL_TRACES_SAMPLER_ARG: "0.2"
  JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=70 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
env: []
envFrom: []

# Segredos via External Secrets Operator (OpenBao KV v2: secret/<env>/<componente>)
externalSecret:              # <<
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  targetName: ""
  dataFrom: []
  data:
    - secretKey: QUARKUS_DATASOURCE_USERNAME
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/db", property: username }
    - secretKey: QUARKUS_DATASOURCE_PASSWORD
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/db", property: password }
    - secretKey: QUARKUS_OIDC_CREDENTIALS_SECRET
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/oidc", property: client_secret }
    - secretKey: S3_ACCESS_KEY
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/s3", property: access_key }
    - secretKey: S3_SECRET_KEY
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/s3", property: secret_key }
    - secretKey: KAFKA_SSL_KEYSTORE_PASSWORD
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/kafka", property: keystore_password }
    - secretKey: SUS_HMAC_KEY_RING
      remoteRef: { key: "{{ .Values.global.environment }}/core-municipal/crypto", property: hmac_key_ring }

serviceMonitor:
  enabled: true
  namespace: ""
  path: /q/metrics             # <<
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack
  metricRelabelings: []

networkPolicy:
  enabled: true
  gatewayNamespace: gateway
  observabilityNamespace: observability
  allowDNS: true
  ingress:                     # << quem pode chamar o core além do gateway
    - from:
        - namespace: fhir
        - namespace: ai
        - namespace: web
        - namespace: connectors
      ports: [{ port: 8080 }]
  egress:                      # << para onde o core pode sair
    - to: [{ namespace: data }]
      ports: [{ port: 5432 }, { port: 9093 }, { port: 8080 }, { port: 6379 }, { port: 9000 }, { port: 443 }]
    - to: [{ namespace: security }]
      ports: [{ port: 8181 }, { port: 8080 }, { port: 8443 }, { port: 8200 }]
    - to: [{ namespace: workflows }]
      ports: [{ port: 7233 }]

apisix:
  enabled: true
  annotations: {}
  priority: 10
  hosts: ["api.{{ .Values.global.domain }}"]
  paths: ["/api/v1/*"]        # <<
  methods: []
  timeout:
    connect: 5s
    send: 30s
    read: 30s
  oidc:
    enabled: true
    discovery: "{{ .Values.global.keycloakUrl }}/realms/{{ .Values.global.keycloakRealm }}/.well-known/openid-configuration"
    clientId: core-municipal
    clientSecret: ""           # use secretRef em hml/prod
    secretRef: core-municipal-apisix-oidc
    bearerOnly: true
    scope: openid
    sslVerify: "yes"
    requiredScopes: []
  rateLimit:
    enabled: true
    count: 600
    timeWindow: 60
    key: "http_x_consumer_username"   # por cliente OIDC; alternativa: remote_addr
    policy: local              # local | redis | redis-cluster
    redisHost: redis.data.svc.cluster.local
    redisPort: 6379
    redisClusterNodes: []
    redisClusterName: ""
  cors:
    enabled: false
    allowOrigins: "https://app.sus-nexus.local"
  waf:
    enabled: false
    directives: default
  canary:
    stableWeight: 100
    canaryWeight: 0
  tls:
    enabled: true
    secretName: ""
    certificate:
      enabled: true
      issuerName: letsencrypt-prod
      issuerKind: ClusterIssuer
  extraPlugins: []

rollout:
  enabled: false               # true → Argo Rollouts (canário) em vez de Deployment
  canary:
    maxSurge: "25%"
    maxUnavailable: 0
    steps:
      - setWeight: 10
      - pause: { duration: 5m }
      - setWeight: 30
      - pause: { duration: 10m }
      - setWeight: 60
      - pause: { duration: 10m }
    trafficRouting: {}         # ex.: { apisix: { route: { name: core-municipal } } }
    analysis:
      enabled: true
      startingStep: 1
      interval: 1m
      failureLimit: 2
      minSuccessRate: 0.99
      maxP99Seconds: 1.0
      prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

migration:                     # << Flyway como Job pré-rollout (core/fhir)
  enabled: true
  image: ""                    # default: mesma imagem do serviço
  command: ["java"]
  args: ["-Dquarkus.flyway.migrate-at-start=true", "-Dquarkus.http.host=127.0.0.1", "-Dsus.migration-only=true", "-jar", "/deployments/quarkus-run.jar"]
  env:
    - name: QUARKUS_FLYWAY_MIGRATE_AT_START
      value: "true"
  backoffLimit: 2
  activeDeadlineSeconds: 900
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }
