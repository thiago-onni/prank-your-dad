# Valores padrão — sus-nexus-fhir (Quarkus, porta 8081). Estrutura idêntica ao sus-nexus-core.
# Gerado a partir de sus-nexus-core/values.yaml (scripts/gen-component-values.py); edite com cuidado.

global:
  environment: dev
  imageRegistry: ''
  imagePullSecrets: []
  multiZone: false
  domain: sus-nexus.local
  keycloakUrl: https://auth.sus-nexus.local
  keycloakRealm: sus-nexus
  namespaces:
    core: core
    fhir: fhir
    connectors: connectors
    ai: ai
    web: web
    data: data
    security: security
    workflows: workflows
    observability: observability
    gateway: gateway
nameOverride: ''
fullnameOverride: fhir-gateway
namespaceOverride: ''
component: fhir-gateway
tier: backend
image:
  registry: ghcr.io
  repository: sus-nexus/fhir-gateway
  tag: ''
  digest: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 2
revisionHistoryLimit: 3
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0
terminationGracePeriodSeconds: 30
priorityClassName: ''
containerPort: 8081
extraPorts: []
command: []
args: []
service:
  type: ClusterIP
  port: 8081
  annotations: {}
probes:
  startup:
    enabled: true
    path: /q/health/started
    periodSeconds: 5
    failureThreshold: 60
    timeoutSeconds: 3
  liveness:
    path: /q/health/live
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
  readiness:
    path: /q/health/ready
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3
lifecycle:
  preStop:
    exec:
      command:
      - sh
      - -c
      - sleep 5
resources:
  requests:
    cpu: 300m
    memory: 512Mi
  limits:
    cpu: 1500m
    memory: 1Gi
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 185
  runAsGroup: 185
  fsGroup: 185
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  runAsNonRoot: true
  capabilities:
    drop:
    - ALL
tmpSizeLimit: 512Mi
writableDirs: []
extraVolumes: []
extraVolumeMounts: []
initContainers: []
sidecars: []
podLabels: {}
podAnnotations:
  prometheus.io/scrape: 'false'
extraLabels: {}
deploymentAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
serviceAccount:
  create: true
  automount: false
  name: ''
  annotations: {}
hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  scaleDownStabilizationSeconds: 300
  customMetrics: []
pdb:
  enabled: true
  minAvailable: 1
  maxUnavailable: null
otel:
  enabled: true
  endpoint: http://otel-collector.observability.svc.cluster.local:4317
  protocol: grpc
config:
  QUARKUS_PROFILE: prod
  QUARKUS_HTTP_PORT: '8081'
  QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://fhir-db-rw.data.svc.cluster.local:5432/sus_nexus_fhir
  QUARKUS_DATASOURCE_JDBC_MAX_SIZE: '20'
  QUARKUS_FLYWAY_MIGRATE_AT_START: 'false'
  QUARKUS_OIDC_AUTH_SERVER_URL: '{{ .Values.global.keycloakUrl }}/realms/{{ .Values.global.keycloakRealm }}'
  QUARKUS_OIDC_CLIENT_ID: fhir-gateway
  QUARKUS_OIDC_TOKEN_AUDIENCE: fhir-gateway
  CORE_API_URL: http://core-municipal.core.svc.cluster.local:8080/api/v1
  KAFKA_BOOTSTRAP_SERVERS: sus-kafka-kafka-bootstrap.data.svc.cluster.local:9093
  KAFKA_SECURITY_PROTOCOL: SSL
  APICURIO_REGISTRY_URL: http://apicurio.data.svc.cluster.local:8080/apis/registry/v3
  OPA_URL: http://opa.security.svc.cluster.local:8181
  S3_ENDPOINT: https://minio.data.svc.cluster.local
  FHIR_BASE_URL: https://fhir.{{ .Values.global.domain }}/fhir/r4
  FHIR_VALIDATION_PROFILES: br-core,sus-nexus
  QUARKUS_LOG_CONSOLE_JSON: 'true'
  QUARKUS_LOG_LEVEL: INFO
  QUARKUS_OTEL_SDK_DISABLED: 'false'
  JAVA_OPTS_APPEND: -XX:MaxRAMPercentage=70 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom
env: []
envFrom: []
externalSecret:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  targetName: ''
  dataFrom: []
  data:
  - secretKey: QUARKUS_DATASOURCE_USERNAME
    remoteRef:
      key: '{{ .Values.global.environment }}/fhir-gateway/db'
      property: username
  - secretKey: QUARKUS_DATASOURCE_PASSWORD
    remoteRef:
      key: '{{ .Values.global.environment }}/fhir-gateway/db'
      property: password
  - secretKey: QUARKUS_OIDC_CREDENTIALS_SECRET
    remoteRef:
      key: '{{ .Values.global.environment }}/fhir-gateway/oidc'
      property: client_secret
  - secretKey: S3_ACCESS_KEY
    remoteRef:
      key: '{{ .Values.global.environment }}/fhir-gateway/s3'
      property: access_key
  - secretKey: S3_SECRET_KEY
    remoteRef:
      key: '{{ .Values.global.environment }}/fhir-gateway/s3'
      property: secret_key
  - secretKey: KAFKA_SSL_KEYSTORE_PASSWORD
    remoteRef:
      key: '{{ .Values.global.environment }}/fhir-gateway/kafka'
      property: keystore_password
serviceMonitor:
  enabled: true
  namespace: ''
  path: /q/metrics
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack
  metricRelabelings: []
networkPolicy:
  enabled: true
  gatewayNamespace: gateway
  observabilityNamespace: observability
  allowDNS: true
  ingress:
  - from:
    - namespace: ai
    - namespace: web
    - namespace: core
    ports:
    - port: 8081
  egress:
  - to:
    - namespace: data
    ports:
    - port: 5432
    - port: 9093
    - port: 8080
    - port: 9000
    - port: 443
  - to:
    - namespace: security
    ports:
    - port: 8181
    - port: 8080
    - port: 8443
  - to:
    - namespace: core
    ports:
    - port: 8080
apisix:
  enabled: true
  annotations: {}
  priority: 10
  hosts:
  - fhir.{{ .Values.global.domain }}
  paths:
  - /fhir/r4/*
  methods: []
  timeout:
    connect: 5s
    send: 30s
    read: 30s
  oidc:
    enabled: true
    discovery: '{{ .Values.global.keycloakUrl }}/realms/{{ .Values.global.keycloakRealm }}/.well-known/openid-configuration'
    clientId: fhir-gateway
    clientSecret: ''
    secretRef: fhir-gateway-apisix-oidc
    bearerOnly: true
    scope: openid
    sslVerify: 'yes'
    requiredScopes: []
  rateLimit:
    enabled: true
    count: 300
    timeWindow: 60
    key: http_x_consumer_username
    policy: local
    redisHost: redis.data.svc.cluster.local
    redisPort: 6379
    redisClusterNodes: []
    redisClusterName: ''
  cors:
    enabled: false
    allowOrigins: https://app.sus-nexus.local
  waf:
    enabled: false
    directives: default
  canary:
    stableWeight: 100
    canaryWeight: 0
  tls:
    enabled: true
    secretName: ''
    certificate:
      enabled: true
      issuerName: letsencrypt-prod
      issuerKind: ClusterIssuer
  extraPlugins: []
rollout:
  enabled: false
  canary:
    maxSurge: 25%
    maxUnavailable: 0
    steps:
    - setWeight: 10
    - pause:
        duration: 5m
    - setWeight: 30
    - pause:
        duration: 10m
    - setWeight: 60
    - pause:
        duration: 10m
    trafficRouting: {}
    analysis:
      enabled: true
      startingStep: 1
      interval: 1m
      failureLimit: 2
      minSuccessRate: 0.99
      maxP99Seconds: 1.5
      prometheusAddress: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
migration:
  enabled: true
  image: ''
  command:
  - java
  args:
  - -Dquarkus.flyway.migrate-at-start=true
  - -Dquarkus.http.host=127.0.0.1
  - -Dsus.migration-only=true
  - -jar
  - /deployments/quarkus-run.jar
  env:
  - name: QUARKUS_FLYWAY_MIGRATE_AT_START
    value: 'true'
  backoffLimit: 2
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
