{{- if eq (include "sus.workloadEnabled" .) "true" }}
{{- if .Values.externalSecret.enabled }}
# External Secrets Operator → OpenBao (KV v2). O ClusterSecretStore é instalado por
# platform/security/external-secrets/.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "sus.fullname" . }}
  namespace: {{ include "sus.namespace" . }}
  labels:
    {{- include "sus.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "sus.secretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          {{- include "sus.selectorLabels" . | nindent 10 }}
  {{- if .Values.externalSecret.dataFrom }}
  dataFrom:
    {{- range .Values.externalSecret.dataFrom }}
    - extract:
        key: {{ tpl .key $ | quote }}
        {{- with .property }}
        property: {{ . }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if .Values.externalSecret.data }}
  data:
    {{- range .Values.externalSecret.data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ tpl .remoteRef.key $ | quote }}
        property: {{ .remoteRef.property }}
        {{- with .remoteRef.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
