{{- $ns := .Values.strimzi.namespace | default .Values.global.namespaces.data }}
{{- $cluster := .Values.strimzi.clusterName }}
{{- $rf := int .Values.strimzi.topicReplication }}
{{- $minIsr := int .Values.strimzi.topicMinInsyncReplicas }}
{{- $pf := .Values.strimzi.partitionFactor | default 1.0 }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: sus-ingest-pec-v1
  namespace: {{ $ns }}
  labels:
    strimzi.io/cluster: {{ $cluster }}
    app.kubernetes.io/part-of: sus-nexus
    sus-nexus.gov.br/topic-class: ingest
  annotations:
    sus-nexus.gov.br/topic: sus.ingest.pec.v1
    sus-nexus.gov.br/partition-key: source.source_record_id
    sus-nexus.gov.br/schema-compatibility: BACKWARD
spec:
  topicName: sus.ingest.pec.v1
  partitions: {{ max 1 (int (mulf 12 $pf)) }}
  replicas: {{ $rf }}
  config:
    retention.ms: "604800000"
    min.insync.replicas: "{{ $minIsr }}"
    cleanup.policy: delete
    compression.type: producer
    max.message.bytes: "4194304"
---
