{{- if .Values.apicurio.enabled }}
{{- $ns := include "umbrella.ns.data" . }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: apicurio-db
  namespace: {{ $ns }}
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.global.secretStore.name }}
    kind: {{ .Values.global.secretStore.kind }}
  target:
    name: apicurio-db
  data:
    - secretKey: APICURIO_DATASOURCE_USERNAME
      remoteRef: { key: "{{ .Values.global.environment }}/data/apicurio-db", property: username }
    - secretKey: APICURIO_DATASOURCE_PASSWORD
      remoteRef: { key: "{{ .Values.global.environment }}/data/apicurio-db", property: password }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apicurio
  namespace: {{ $ns }}
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
  namespace: {{ $ns }}
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/name: apicurio
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  replicas: {{ .Values.apicurio.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio
        {{- include "umbrella.labels" . | nindent 8 }}
    spec:
      serviceAccountName: apicurio
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apicurio
          image: {{ .Values.apicurio.image }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APICURIO_STORAGE_KIND
              value: sql
            - name: APICURIO_STORAGE_SQL_KIND
              value: postgresql
            - name: APICURIO_DATASOURCE_URL
              value: jdbc:postgresql://apicurio-db-rw.{{ $ns }}.svc.cluster.local:5432/apicurio?sslmode=require
            - name: APICURIO_AUTH_ENABLED
              value: {{ .Values.apicurio.auth.enabled | quote }}
            - name: QUARKUS_OIDC_AUTH_SERVER_URL
              value: "{{ .Values.global.keycloakUrl }}/realms/{{ .Values.global.keycloakRealm }}"
            - name: QUARKUS_OIDC_CLIENT_ID
              value: apicurio-registry
            - name: APICURIO_REST_DELETION_ARTIFACT_VERSION_ENABLED
              value: "false"
            - name: QUARKUS_LOG_CONSOLE_JSON
              value: "true"
            - name: QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.{{ .Values.global.namespaces.observability }}.svc.cluster.local:4317
          envFrom:
            - secretRef:
                name: apicurio-db
          startupProbe:
            httpGet: { path: /health/started, port: http }
            periodSeconds: 5
            failureThreshold: 40
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apicurio.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
  namespace: {{ $ns }}
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    app.kubernetes.io/name: apicurio
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: apicurio
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apicurio
  namespace: {{ $ns }}
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: apicurio
  namespace: {{ $ns }}
  labels:
    {{- include "umbrella.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio
  endpoints:
    - port: http
      path: /q/metrics
      interval: 30s
{{- end }}
