minio:
  enabled: false
  image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
  mcImage: quay.io/minio/mc:RELEASE.2024-11-21T17-21-54Z
  servers: 4
  volumesPerServer: 4
  volumeSize: 500Gi
  storageClass: standard
  lakehouseBucket: false
  resources:
    requests: { cpu: "1", memory: 4Gi }
    limits: { cpu: "4", memory: 8Gi }
  auditArchive:
    lockMode: COMPLIANCE
