# Valores padrão do chart umbrella sus-nexus. Sobrescreva com values-dev.yaml / values-hml.yaml /
# values-prod.yaml. Todos os blocos são opcionais; o Argo CD (platform/argocd) habilita subconjuntos por
# Application (data, security, workflows, core, fhir, web, ai, connectors).

global:
  environment: dev
  domain: dev.sus-nexus.local
  imageRegistry: ""              # ex.: harbor.sus-nexus.local/sus-nexus
  imagePullSecrets: []
  multiZone: false
  keycloakUrl: https://auth.dev.sus-nexus.local
  keycloakRealm: sus-nexus
  secretStore:
    name: openbao
    kind: ClusterSecretStore
  namespaces:
    core: core
    fhir: fhir
    connectors: connectors
    ai: ai
    web: web
    data: data
    security: security
    workflows: workflows
    observability: observability
    gateway: gateway

# ----------------------------------------------------------------------------------------------------
# Componentes da aplicação (subcharts). Chaves abaixo são repassadas ao chart correspondente.
# ----------------------------------------------------------------------------------------------------
core:
  enabled: false
  namespaceOverride: core
fhir:
  enabled: false
  namespaceOverride: fhir
web:
  enabled: false
  namespaceOverride: web
ai:
  enabled: false
  namespaceOverride: ai

connector-pec:
  enabled: false
  namespaceOverride: connectors
  fullnameOverride: connector-pec
  image: { repository: sus-nexus/connector-pec }
  connector: { id: pec, sourceSystem: PEC, ingestTopic: sus.ingest.pec.v1, tenantId: ibge_3143302, pollInterval: PT5M, reconciliationCron: "0 0 3 * * ?", edgeAgent: false }
connector-agenda:
  enabled: false
  namespaceOverride: connectors
  fullnameOverride: connector-agenda
  image: { repository: sus-nexus/connector-agenda }
  connector: { id: agenda, sourceSystem: AGENDA, ingestTopic: sus.ingest.agenda.v1, tenantId: ibge_3143302, pollInterval: PT2M, reconciliationCron: "0 0 3 * * ?", edgeAgent: false }
connector-cnes:
  enabled: false
  namespaceOverride: connectors
  fullnameOverride: connector-cnes
  image: { repository: sus-nexus/connector-cnes }
  connector: { id: cnes, sourceSystem: CNES, ingestTopic: sus.ingest.cnes.v1, tenantId: ibge_3143302, pollInterval: P1D, reconciliationCron: "0 0 5 * * ?", edgeAgent: false }
connector-cadsus:
  enabled: false
  namespaceOverride: connectors
  fullnameOverride: connector-cadsus
  image: { repository: sus-nexus/connector-cadsus }
  connector: { id: cadsus, sourceSystem: CADSUS, ingestTopic: sus.ingest.pec.v1, tenantId: ibge_3143302, pollInterval: PT30M, reconciliationCron: "0 0 5 * * ?", edgeAgent: false }
# Conectores do runtime genérico com imagem própria (sus-nexus/connectors/Dockerfile, build args
# CONNECTOR_MODULE/PORT). Autenticam no core por client credentials (`connector-<id>` no Keycloak).
connector-sisreg:
  enabled: false
  namespaceOverride: connectors
  fullnameOverride: connector-sisreg
  image: { repository: sus-nexus/connector-sisreg }
  containerPort: 8093
  service: { port: 8093 }
  writableDirs: [{ name: data, mountPath: /app/data, sizeLimit: 1Gi }]
  config:
    PORT: "8093"                 # a imagem fixa -Dquarkus.http.port=${PORT} (build arg PORT=8093)
    QUARKUS_HTTP_PORT: "8093"
    TENANT_ID: "{{ .Values.connector.tenantId }}"
    CORE_URL: http://core-municipal.core.svc.cluster.local:8080
    CORE_AUTH_MODE: oidc
    KEYCLOAK_URL: "{{ .Values.global.keycloakUrl }}"
    CORE_CLIENT_ID: "connector-{{ .Values.connector.id }}"
    RAW_STORE_TYPE: s3
    RAW_STORE_ENDPOINT: https://minio.data.svc.cluster.local
    RAW_STORE_BUCKET: raw-zone
    DLQ_DIR: /app/data/dlq
  externalSecret:
    data:   # o SDK usa a cadeia padrão AWS (AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY) para o raw store S3
      - { secretKey: QUARKUS_OIDC_CLIENT_CREDENTIALS_SECRET, remoteRef: { key: "{{ .Values.global.environment }}/connector-{{ .Values.connector.id }}/oidc", property: client_secret } }
      - { secretKey: AWS_ACCESS_KEY_ID, remoteRef: { key: "{{ .Values.global.environment }}/connector-{{ .Values.connector.id }}/s3", property: access_key } }
      - { secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: { key: "{{ .Values.global.environment }}/connector-{{ .Values.connector.id }}/s3", property: secret_key } }
  connector:
    id: sisreg
    sourceSystem: SISREG
    ingestTopic: sus.ingest.regulation.v1
    tenantId: ibge_3143302
    pollInterval: PT15M
    reconciliationCron: "0 0 4 * * ?"
    edgeAgent: false
