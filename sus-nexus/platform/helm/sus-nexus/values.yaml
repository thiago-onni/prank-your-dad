# ----------------------------------------------------------------------------------------------------
# Plataforma de dados
# ----------------------------------------------------------------------------------------------------
cnpg:
  enabled: false
  defaults:
    instances: 3
    imageName: ghcr.io/cloudnative-pg/postgresql:16.6
    storageClass: fast-nvme
    storageSize: 100Gi
    walStorageSize: 20Gi
    extensions: [pg_trgm, unaccent, pgcrypto, uuid-ossp, pg_stat_statements]
    resources:
      requests: { cpu: "1", memory: 4Gi }
      limits: { cpu: "4", memory: 8Gi }
  backup:
    enabled: true
    bucket: backups
    endpointURL: https://minio.data.svc.cluster.local
    endpointCA: { name: minio-ca, key: ca.crt }   # null para S3 público
    retentionPolicy: 30d
    schedule: "0 0 2 * * *"      # CNPG usa 6 campos (segundos)
  clusters:
    core-db:
      enabled: true
      database: sus_nexus_core
      owner: sus_nexus
      extensions: [pg_trgm, unaccent, pgcrypto, uuid-ossp, pg_stat_statements, vector]
      imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:pg16-v0.3.0   # imagem com pgvector; troque por ghcr.io/cloudnative-pg/postgresql se não usar vector no core
      storageSize: 500Gi
      synchronous: true
      logicalReplicationUser: true   # cria papel debezium (CDC do outbox)
      pooler: { instances: 2 }
      resources:
        requests: { cpu: "2", memory: 8Gi }
        limits: { cpu: "8", memory: 32Gi }
      sharedBuffers: 8GB
      effectiveCacheSize: 24GB
      maxConnections: "300"
    fhir-db:
      enabled: true
      database: sus_nexus_fhir
      owner: sus_nexus
      storageSize: 200Gi
    temporal-db:
      enabled: true
      database: temporal
      owner: temporal
      postInitSQL: ["CREATE DATABASE temporal_visibility OWNER temporal;"]
      storageSize: 100Gi
    keycloak-db:
      enabled: true
      database: keycloak
      owner: keycloak
      instances: 2
      storageSize: 20Gi
    langfuse-db:
      enabled: true
      database: langfuse
      owner: langfuse
      instances: 2
      storageSize: 50Gi
    ai-db:
      enabled: true
      database: sus_nexus_ai
      owner: sus_nexus
      instances: 2
      extensions: [pgcrypto, uuid-ossp, vector]
      imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:pg16-v0.3.0
      storageSize: 50Gi
    apicurio-db:
      enabled: true
      database: apicurio
      owner: apicurio
      instances: 2
      storageSize: 10Gi
    # Catálogo JDBC do Apache Iceberg (lakehouse — Fase 4). Tabelas de metadados criadas no bootstrap
    # (o Trino exige que existam; schema V1 = com views). Ligue junto com `lakehouse.enabled`.
    lakehouse-db:
      enabled: false
      database: iceberg_catalog
      owner: iceberg
      instances: 2
      storageSize: 10Gi
      extensions: [pg_stat_statements]
      postInitSQL:
        - CREATE TABLE IF NOT EXISTS iceberg_tables (catalog_name VARCHAR(255) NOT NULL, table_namespace VARCHAR(255) NOT NULL, table_name VARCHAR(255) NOT NULL, metadata_location VARCHAR(1000), previous_metadata_location VARCHAR(1000), iceberg_type VARCHAR(5), PRIMARY KEY (catalog_name, table_namespace, table_name));
        - CREATE TABLE IF NOT EXISTS iceberg_namespace_properties (catalog_name VARCHAR(255) NOT NULL, namespace VARCHAR(255) NOT NULL, property_key VARCHAR(255), property_value VARCHAR(1000), PRIMARY KEY (catalog_name, namespace, property_key));
        - ALTER TABLE iceberg_tables OWNER TO iceberg;
        - ALTER TABLE iceberg_namespace_properties OWNER TO iceberg;

strimzi:
  enabled: false
  namespace: ""                   # default: global.namespaces.data
  clusterName: sus-kafka
  kafkaVersion: "3.9.0"
  metadataVersion: "3.9-IV0"
  topicReplication: 3
  topicMinInsyncReplicas: 2
  partitionFactor: 1.0            # dev: 0.25 → 12 partições viram 3
  nodePool:
    name: dual
    replicas: 3
    storageClass: fast-nvme
    storageSize: 500Gi
    resources:
      requests: { cpu: "2", memory: 8Gi }
      limits: { cpu: "4", memory: 16Gi }
    jvm: { xms: 4g, xmx: 4g }
  rack: { topologyKey: topology.kubernetes.io/zone }
  cruiseControl: { enabled: true }
  externalListener:
    enabled: false
    type: loadbalancer
    configuration: {}
  # ACLs por serviço (KAF-010). Conectores: gerados automaticamente (templates/kafka-users.yaml).
  users:
    - name: core-municipal
      acls:
        - { type: topic, name: "sus.", patternType: prefix, operations: [Describe, Read, Write] }
        - { type: topic, name: "core.", patternType: prefix, operations: [Describe, Read] }
        - { type: group, name: "core-", patternType: prefix, operations: [Read, Describe] }
        - { type: transactionalId, name: "core-", patternType: prefix, operations: [Describe, Write] }
    - name: fhir-gateway
      acls:
        - { type: topic, name: "sus.identity.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.aps.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.schedule.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.regulation.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.exam.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.hospital.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.careplan.v1", patternType: literal, operations: [Describe, Read] }
        - { type: topic, name: "sus.consent.v1", patternType: literal, operations: [Describe, Read] }
        - { type: topic, name: "sus.audit.v1", patternType: literal, operations: [Describe, Write] }
        - { type: topic, name: "sus.dlq.v1", patternType: literal, operations: [Describe, Write] }
        - { type: group, name: "fhir-", patternType: prefix, operations: [Read, Describe] }
    - name: ai-service
      acls:
        - { type: topic, name: "sus.task.v1", patternType: literal, operations: [Describe, Read] }
        - { type: topic, name: "sus.regulation.", patternType: prefix, operations: [Describe, Read] }
        - { type: topic, name: "sus.hospital.discharge.v1", patternType: literal, operations: [Describe, Read] }
        - { type: topic, name: "sus.caregap.v1", patternType: literal, operations: [Describe, Read] }
        - { type: topic, name: "sus.audit.v1", patternType: literal, operations: [Describe, Write] }
        - { type: group, name: "ai-", patternType: prefix, operations: [Read, Describe] }
    - name: kafka-ui
      authentication: scram-sha-512
      acls:
        - { type: topic, name: "*", patternType: literal, operations: [Describe, DescribeConfigs, Read] }
        - { type: group, name: "*", patternType: literal, operations: [Describe, Read] }
        - { type: cluster, name: kafka-cluster, patternType: literal, operations: [Describe, DescribeConfigs] }
    - name: mirrormaker2-dr
      acls:
        - { type: topic, name: "sus.", patternType: prefix, operations: [Describe, DescribeConfigs, Read] }
        - { type: group, name: "mirrormaker2-", patternType: prefix, operations: [Read, Describe] }
        - { type: cluster, name: kafka-cluster, patternType: literal, operations: [Describe, DescribeConfigs] }

kafkaConnect:
  enabled: false
  replicas: 2
  image: ghcr.io/sus-nexus/kafka-connect-debezium:3.0.0   # imagem Strimzi + plugin Debezium PG (build no CI images)
  resources:
    requests: { cpu: 500m, memory: 1Gi }
