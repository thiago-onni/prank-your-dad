apiVersion: v2
name: sus-nexus
description: |
  Chart umbrella do SUS Nexus: componentes da aplicação (core, fhir, web, ai, conectores) + recursos
  de plataforma gerenciados por operadores (CloudNativePG, Strimzi, Keycloak Operator, MinIO Operator,
  Apicurio, OPA, Redis) + Temporal e Trino (charts oficiais como dependência) + lakehouse (Kafka Connect
  Iceberg sink). Os operadores em si são instalados
  pelo Argo CD (platform/argocd/apps/operators). Cada bloco é opcional (`<bloco>.enabled`).
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/sus-nexus/sus-nexus
keywords: [sus-nexus, umbrella, platform]
maintainers:
  - name: Plataforma SUS Nexus
dependencies:
  # --- componentes (charts locais) ---
  - name: sus-nexus-core
    version: 0.1.0
    repository: file://../charts/sus-nexus-core
    alias: core
    condition: core.enabled
  - name: sus-nexus-fhir
    version: 0.1.0
    repository: file://../charts/sus-nexus-fhir
    alias: fhir
    condition: fhir.enabled
  - name: sus-nexus-web
    version: 0.1.0
    repository: file://../charts/sus-nexus-web
    alias: web
    condition: web.enabled
  - name: sus-nexus-ai
    version: 0.1.0
    repository: file://../charts/sus-nexus-ai
    alias: ai
    condition: ai.enabled
  # Um alias por conector (chart genérico). Para adicionar um conector, copie um bloco e crie
  # `connector-<id>:` nos values (ver platform/README.md "Como adicionar um conector").
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-pec
    condition: connector-pec.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-agenda
    condition: connector-agenda.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-sisreg
    condition: connector-sisreg.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-cnes
    condition: connector-cnes.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-cadsus
    condition: connector-cadsus.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-his
    condition: connector-his.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-esus-regulacao
    condition: connector-esus-regulacao.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-lis
    condition: connector-lis.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-ris
    condition: connector-ris.enabled
  - name: sus-nexus-connector
    version: 0.1.0
    repository: file://../charts/sus-nexus-connector
    alias: connector-sia
    condition: connector-sia.enabled
  # --- Temporal (chart oficial) ---
  - name: temporal
    version: 0.52.0
    repository: https://go.temporal.io/helm-charts
    condition: temporal.enabled
  # --- Trino (chart oficial) — lakehouse, Fase 4 ---
  - name: trino
    version: 1.42.2
    repository: https://trinodb.github.io/charts
    condition: trino.enabled
