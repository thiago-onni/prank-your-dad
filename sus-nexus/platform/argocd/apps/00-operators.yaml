# Operadores e add-ons de cluster (sync wave 0..10) — um Application por item, gerado por ApplicationSet.
# Ordem (waves): CNI/cert-manager/ESO/Kyverno (0) → operadores de dados (5) → gateway/rollouts/obs (10).
# Versões fixadas; atualização por PR (Renovate pode abrir PRs automaticamente).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sus-nexus-operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchLabels:
                  sus-nexus.gov.br/managed: "true"
              values:
                env: "{{ index .metadata.labels \"sus-nexus.gov.br/env\" }}"
          - list:
              elements:
                - { app: cert-manager, repo: https://charts.jetstack.io, chart: cert-manager, version: v1.16.2, namespace: cert-manager, wave: "0", values: "installCRDs: true\nprometheus:\n  enabled: true\n  servicemonitor:\n    enabled: true" }
                - { app: external-secrets, repo: https://charts.external-secrets.io, chart: external-secrets, version: 0.11.0, namespace: external-secrets, wave: "0", values: "installCRDs: true\nserviceMonitor:\n  enabled: true" }
                - { app: kyverno, repo: https://kyverno.github.io/kyverno/, chart: kyverno, version: 3.3.4, namespace: kyverno, wave: "0", values: "admissionController:\n  replicas: 3\nbackgroundController:\n  replicas: 2\nreportsController:\n  replicas: 2\ncleanupController:\n  replicas: 2" }
                - { app: openbao, repo: https://openbao.github.io/openbao-helm, chart: openbao, version: 0.8.1, namespace: openbao, wave: "1", values: "server:\n  ha:\n    enabled: true\n    replicas: 3\n    raft:\n      enabled: true\n  auditStorage:\n    enabled: true\n  dataStorage:\n    storageClass: fast-nvme\ninjector:\n  enabled: false\nui:\n  enabled: true" }
                - { app: cnpg, repo: https://cloudnative-pg.github.io/charts, chart: cloudnative-pg, version: 0.23.0, namespace: cnpg-system, wave: "5", values: "monitoring:\n  podMonitorEnabled: true\n  grafanaDashboard:\n    create: true" }
                - { app: strimzi, repo: oci://quay.io/strimzi-helm, chart: strimzi-kafka-operator, version: 0.45.0, namespace: strimzi-system, wave: "5", values: "watchAnyNamespace: true\nfeatureGates: ''\nresources:\n  requests:\n    cpu: 200m\n    memory: 384Mi\n  limits:\n    cpu: '1'\n    memory: 768Mi" }
                - { app: minio-operator, repo: https://operator.min.io, chart: operator, version: 6.0.4, namespace: minio-operator, wave: "5", values: "operator:\n  replicaCount: 2" }
                - { app: keycloak-operator, repo: https://github.com/sus-nexus/sus-nexus.git, chart: "", path: sus-nexus/platform/argocd/vendor/keycloak-operator, version: main, namespace: keycloak-operator, wave: "5", values: "" }
                - { app: apisix, repo: https://charts.apache.org, chart: apisix, version: 2.10.0, namespace: gateway, wave: "10", values: "ingress-controller:\n  enabled: true\n  config:\n    apisix:\n      serviceNamespace: gateway\nservice:\n  type: LoadBalancer\nreplicaCount: 3\netcd:\n  replicaCount: 3\napisix:\n  ssl:\n    enabled: true\n  plugins:\n    - openid-connect\n    - limit-count\n    - cors\n    - request-id\n    - response-rewrite\n    - ip-restriction\n    - prometheus\n    - opentelemetry\n    - real-ip\n  prometheus:\n    enabled: true\nserviceMonitor:\n  enabled: true" }
                - { app: argo-rollouts, repo: https://argoproj.github.io/argo-helm, chart: argo-rollouts, version: 2.38.0, namespace: argo-rollouts, wave: "10", values: "controller:\n  replicas: 2\n  metrics:\n    enabled: true\n    serviceMonitor:\n      enabled: true\ndashboard:\n  enabled: true" }
                - { app: kube-prometheus-stack, repo: https://prometheus-community.github.io/helm-charts, chart: kube-prometheus-stack, version: 66.3.1, namespace: observability, wave: "10", values: "# valores completos em platform/observability/kube-prometheus-stack-values.yaml (multi-source abaixo)" }
                - { app: loki, repo: https://grafana.github.io/helm-charts, chart: loki, version: 6.24.0, namespace: observability, wave: "10", values: "# platform/observability/loki-values.yaml" }
                - { app: tempo, repo: https://grafana.github.io/helm-charts, chart: tempo-distributed, version: 1.26.0, namespace: observability, wave: "10", values: "# platform/observability/tempo-values.yaml" }
                - { app: otel-collector, repo: https://open-telemetry.github.io/opentelemetry-helm-charts, chart: opentelemetry-collector, version: 0.111.2, namespace: observability, wave: "10", values: "# platform/observability/otel-collector-values.yaml" }
                - { app: velero, repo: https://vmware-tanzu.github.io/helm-charts, chart: velero, version: 8.1.0, namespace: velero, wave: "10", values: "# platform/backup-dr/velero-values.yaml" }
                - { app: harbor, repo: https://helm.goharbor.io, chart: harbor, version: 1.16.0, namespace: harbor, wave: "10", values: "# gerado por terraform/modules/registry (harbor-values.yaml)" }
  template:
    metadata:
      name: "{{ .app }}-{{ .values.env }}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .wave }}"
      labels:
        sus-nexus.gov.br/layer: operators
        sus-nexus.gov.br/env: "{{ .values.env }}"
    spec:
      project: "sus-nexus-{{ .values.env }}"
      sources:
        - repoURL: "{{ .repo }}"
          chart: "{{ .chart }}"
          path: "{{ .path | default \"\" }}"
          targetRevision: "{{ .version }}"
          helm:
            releaseName: "{{ .app }}"
            valuesObject: {}
            values: "{{ .values }}"
            valueFiles:
              - "$values/sus-nexus/platform/observability/{{ .app }}-values.yaml"
              - "$values/sus-nexus/platform/backup-dr/{{ .app }}-values.yaml"
            ignoreMissingValueFiles: true
            skipCrds: false
        - repoURL: https://github.com/sus-nexus/sus-nexus.git
          targetRevision: main
          ref: values
      destination:
        name: "{{ .name }}"   # nome do cluster (gerador clusters)
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: false        # operadores nunca são removidos automaticamente
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - Replace=false
        retry:
          limit: 5
          backoff: { duration: 30s, factor: 2, maxDuration: 10m }
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          jsonPointers: [/spec/conversion/webhook/clientConfig/caBundle]
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions: ['.webhooks[].clientConfig.caBundle']
